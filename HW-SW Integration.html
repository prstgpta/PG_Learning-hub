<style>
  :root{

  #content{flex:1; max-width:900px; margin:0 auto; padding:40px 44px 120px}
  section{display:none; animation:fade .3s ease}
  section.active{display:block}

  h2{font-size:1.7rem; margin:0 0 6px; color:var(--text); border-bottom:2px solid var(--accent); padding-bottom:10px}

  .callout.tip{border-color:var(--accent)}
  .callout.warn{border-color:var(--warn)}
  .callout.key{border-color:var(--danger)}

  table{width:100%; border-collapse:collapse; margin:16px 0; font-size:.9rem}

  .checkbox input{width:18px; height:18px; accent-color:var(--accent)}

{
  id:"intro",

  title:"0. Orientation & Big Picture",
  html:`
    <h2>🎯 Orientation & The Big Picture</h2>
    <p class="lead">Before touching a single wire or line of code, understand <b>what</b> HW/SW integration is and <b>why</b> it exists.</p>

    <div class="callout key">
      <span class="label">Core idea</span>
      HW/SW integration is the phase where <b>software written for a target</b> is brought together with the <b>physical electronic hardware (ECU)</b> and made to work as one functioning unit — then verified against requirements.
    </div>

    <h3>An ECU is a tiny computer for a car function</h3>
    <p>A car has 50–150+ <b>ECUs</b> (Electronic Control Units). Each is a small embedded computer that reads sensors, runs software, and drives actuators.</p>
    <div class="diagram">
   SENSORS            ECU  (the computer)            ACTUATORS
   ┌────────┐    ┌──────────────────────────┐    ┌────────────┐
   │ wheel  │───▶│  Microcontroller (MCU)   │───▶│  brake     │
   │ speed  │    │  ┌────────┐  ┌─────────┐ │    │  valve     │
   │ pedal  │───▶│  │ SW/App │  │ Flash   │ │───▶│  motor     │
   │ temp   │    │  │  RTOS  │  │ RAM     │ │    │  relay     │
   └────────┘    │  └────────┘  └─────────┘ │    └────────────┘
                 │   CAN / LIN / Ethernet   │
                 └───────────┬──────────────┘
                             │  vehicle network
                       other ECUs
    </div>

    <h3>Where integration sits: the V-Model</h3>
    <p>Automotive development follows the <b>V-Model</b>. The <b>left side</b> = design & build (going down in detail). The <b>right side</b> = test & verify (going up). Integration is on the way up.</p>
    <div class="diagram">
  Requirements ─────────────────────────▶ Vehicle / Acceptance Test
    │                                             ▲
    System Design ──────────────▶ System Integration Test
      │                                  ▲
      SW/HW Architecture ──▶ Integration Test  ◀── HW/SW INTEGRATION
        │                        ▲                  lives here
        Module Design ──▶ Unit Test
          │                ▲
          └──▶ CODE / BUILD HW ──┘
    </div>

    <div class="callout tip">
      <span class="label">Mental model</span>
      "Left side you <b>build</b> from big to small. Right side you <b>test</b> from small to big. Integration = gluing the tested small pieces back into a working whole."
    </div>

    <h3>Who does what</h3>
    <div class="grid">
      <div class="card"><b class="tag-hw">HW Engineer</b><br>Designs the board, schematic, power, MCU choice, connectors. Delivers a working PCB.</div>
      <div class="card"><b class="tag-sw">SW Engineer</b><br>Writes drivers, application logic, config. Delivers firmware (a binary).</div>
      <div class="card"><b>Integration / Systems</b><br>Brings HW + SW together, flashes, brings up the board, debugs, verifies.</div>
      <div class="card"><b>Validation / Test</b><br>Runs formal tests (HIL, bench, vehicle), signs off against requirements.</div>
    </div>

    <div class="callout warn">
      <span class="label">Why it's hard</span>
      SW that runs perfectly in simulation can fail on real hardware: wrong clock speed, timing races, a mis-configured pin, a noisy signal, a wrong voltage. Integration is where "it worked on my machine" meets physics.
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('intro',this.checked)" id="chk-intro">
      <label for="chk-intro">I understand what an ECU is and where integration sits in the V-model.</label>
    </div>
  `

{
  id:"hw",
  icon:"🔌",
  title:"1. Hardware Basics for SW People",
  html:`
    <h2>🔌 Automotive Hardware Basics</h2>
    <p class="lead">You don't need to design boards — but you must read them and know how the pieces relate.</p>

    <h3>Anatomy of an ECU</h3>
    <table>
      <tr><th>Block</th><th>What it does</th><th>Why you care as SW</th></tr>
      <tr><td><b>MCU/SoC</b></td><td>The processor that runs your code</td><td>Defines architecture, clock, memory map</td></tr>
      <tr><td><b>Flash</b></td><td>Non-volatile program storage</td><td>Your firmware lives here; size limits code</td></tr>
      <tr><td><b>RAM</b></td><td>Volatile working memory</td><td>Stack, heap, variables; overflow = crash</td></tr>
      <tr><td><b>EEPROM / Data Flash</b></td><td>Persistent small data</td><td>Calibration, fault memory (DTCs)</td></tr>
      <tr><td><b>Power supply</b></td><td>Regulates 12V → 5V/3.3V</td><td>Brown-out resets, startup order</td></tr>
      <tr><td><b>Watchdog</b></td><td>Resets MCU if SW hangs</td><td>You must "kick" it or it resets you</td></tr>
      <tr><td><b>Transceivers</b></td><td>Convert MCU logic ↔ bus levels (CAN/LIN)</td><td>Needed for the ECU to talk on the network</td></tr>
    </table>

    <h3>Common automotive MCUs</h3>
    <div>
      <span class="chip tag-hw">Infineon AURIX (TriCore)</span>
      <span class="chip tag-hw">NXP S32 / MPC</span>
      <span class="chip tag-hw">Renesas RH850</span>
      <span class="chip tag-hw">TI TMS570 / AM</span>
      <span class="chip tag-hw">STMicro SPC5</span>
    </div>
    <p>These are <b>safety-grade</b> MCUs: they add lockstep cores, ECC memory, and built-in self-tests to meet ISO 26262.</p>

    <h3>MCU peripherals you'll configure</h3>
    <ul class="clean">
      <li><b>GPIO</b> — digital in/out pins (read a switch, drive an LED/relay)</li>
      <li><b>ADC</b> — analog-to-digital (read a temperature or voltage sensor)</li>
      <li><b>PWM</b> — pulse-width modulation (control motor speed, dim a light)</li>
      <li><b>Timers</b> — measure/generate precise time events</li>
      <li><b>DMA</b> — move data without CPU (fast transfers)</li>
      <li><b>Comm blocks</b> — CAN, LIN, SPI, I²C, UART controllers</li>
    </ul>

    <div class="callout tip">
      <span class="label">Pin mux (multiplexing)</span>
      One physical pin can serve several functions. Software configures which one is active. A wrong mux setting is a top cause of "the peripheral is dead" bugs.
    </div>

    <h3>Reading a datasheet / reference manual</h3>
    <p>You will constantly look up:</p>
    <ul class="clean">
      <li>Memory map (where Flash/RAM/registers live)</li>
      <li>Register descriptions (bit-by-bit config)</li>
      <li>Pin assignments & electrical limits (max voltage/current)</li>
      <li>Clock tree (how clocks are derived and their max frequencies)</li>
    </ul>

    <details>
      <summary>▸ Quick electronics refresher (voltage, current, logic levels)</summary>
      <ul class="clean">
        <li><b>Voltage (V)</b> — electrical "pressure". Car battery ≈ 12V; MCU runs at 3.3V or 5V.</li>
        <li><b>Current (A)</b> — flow rate. Too much burns things.</li>
        <li><b>Digital logic</b> — HIGH (e.g. 3.3V) = 1, LOW (0V) = 0.</li>
        <li><b>Pull-up/pull-down</b> — resistors that set a default line state.</li>
        <li><b>Ground (GND)</b> — the 0V reference everything is measured against.</li>
      </ul>
    </details>

    <div class="quiz" data-answer="2">
      <div class="q">Q: Your firmware runs for a few ms then the ECU keeps restarting. Which HW block is the most likely culprit?</div>
      <div class="opt" data-i="0">The ADC</div>
      <div class="opt" data-i="1">The CAN transceiver</div>
      <div class="opt" data-i="2">The watchdog (not being kicked)</div>
      <div class="opt" data-i="3">The EEPROM</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('hw',this.checked)" id="chk-hw">
      <label for="chk-hw">I can name the ECU blocks and the main MCU peripherals.</label>
    </div>
  `

{
  id:"comm",
  icon:"🛰️",
  title:"2. Communication & Buses",
  html:`
    <h2>🛰️ Communication Interfaces & Vehicle Buses</h2>
    <p class="lead">ECUs are useless alone — integration heavily involves getting them to talk.</p>

    <h3>Two layers of communication</h3>
    <div class="grid">
      <div class="card"><b class="tag-net">On-chip / on-board</b><br>Between the MCU and nearby chips.<br><span class="chip tag-net">SPI</span><span class="chip tag-net">I²C</span><span class="chip tag-net">UART</span></div>
      <div class="card"><b class="tag-net">Vehicle network</b><br>Between ECUs across the car.<br><span class="chip tag-net">CAN / CAN-FD</span><span class="chip tag-net">LIN</span><span class="chip tag-net">FlexRay</span><span class="chip tag-net">Ethernet</span></div>
    </div>

    <h3>CAN — the workhorse of automotive</h3>
    <p><b>CAN (Controller Area Network)</b> is the most important bus to understand. It's a robust, two-wire, multi-master broadcast bus.</p>
    <ul class="clean">
      <li><b>Two wires:</b> CAN-High and CAN-Low (differential = noise resistant)</li>
      <li><b>Message-based:</b> frames have an <b>ID</b>, not an address. Everyone hears every message.</li>
      <li><b>Arbitration:</b> lower ID = higher priority; wins the bus automatically.</li>
      <li><b>Speeds:</b> Classic CAN up to 1 Mbit/s; <b>CAN-FD</b> faster + bigger payload (up to 64 bytes).</li>
    </ul>
    <div class="diagram">
   CAN Frame (simplified)
   ┌─────┬───────────┬──────┬───────────────┬─────┬─────┐
   │ SOF │    ID      │ ctrl │   DATA (0-8B)  │ CRC │ ACK │
   └─────┴───────────┴──────┴───────────────┴─────┴─────┘
          ▲ priority              ▲ your signals live here
    </div>

    <div class="callout tip">
      <span class="label">Signals vs. frames</span>
      A CAN <b>frame</b> carries raw bytes. A <b>signal</b> (e.g. "VehicleSpeed") is packed into specific bits of that frame. A <b>DBC file</b> is the dictionary that maps signals ↔ bits. You'll live in DBC files.
    </div>

    <h3>Bus cheat-sheet</h3>
    <table>
      <tr><th>Bus</th><th>Use case</th><th>Speed</th><th>Cost/complexity</th></tr>
      <tr><td>LIN</td><td>Cheap sensors, mirrors, windows</td><td>~20 kbit/s</td><td>Very low</td></tr>
      <tr><td>CAN</td><td>General control (engine, body)</td><td>≤1 Mbit/s</td><td>Low</td></tr>
      <tr><td>CAN-FD</td><td>Same, more data</td><td>≤5–8 Mbit/s</td><td>Low-med</td></tr>
      <tr><td>FlexRay</td><td>Safety, time-critical (chassis)</td><td>10 Mbit/s</td><td>High</td></tr>
      <tr><td>Automotive Ethernet</td><td>ADAS, cameras, infotainment</td><td>100M–10G</td><td>High</td></tr>
    </table>

    <h3>Higher-level protocols you'll meet</h3>
    <ul class="clean">
      <li><b>UDS (ISO 14229)</b> — diagnostics: read/clear fault codes, flash firmware, run routines.</li>
      <li><b>DoIP</b> — diagnostics over IP (Ethernet).</li>
      <li><b>XCP</b> — calibration & measurement (tune parameters live).</li>
      <li><b>SOME/IP</b> — service-oriented comms over Ethernet (Adaptive AUTOSAR).</li>
    </ul>

    <div class="quiz" data-answer="1">
      <div class="q">Q: On a CAN bus, two ECUs transmit at the same instant. Which message wins the bus?</div>
      <div class="opt" data-i="0">The one from the ECU that powered on first</div>
      <div class="opt" data-i="1">The one with the lower (numerically smaller) ID</div>
      <div class="opt" data-i="2">The one with the larger data payload</div>
      <div class="opt" data-i="3">Neither — both are dropped and retried randomly</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('comm',this.checked)" id="chk-comm">
      <label for="chk-comm">I understand CAN basics, signals vs. frames, and the bus cheat-sheet.</label>
    </div>
  `
},
{
  id:"sw",
  icon:"🧩",
  title:"3. Software Stack & AUTOSAR",
  html:`
    <h2>🧩 The Software Stack & Architecture</h2>
    <p class="lead">Understand the layers between your application code and the silicon.</p>

    <h3>Layered thinking</h3>
    <div class="diagram">
   ┌───────────────────────────────────────────┐
   │      APPLICATION  (your car function)      │  ← what the ECU should do
   ├───────────────────────────────────────────┤
   │      RTE  (Runtime Environment)            │  ← the "glue"/middleware
   ├───────────────────────────────────────────┤
   │      BSW  (Basic Software: comms, diag,    │  ← services
   │           memory, OS)                      │
   ├───────────────────────────────────────────┤
   │      MCAL (MicroController Abstraction)    │  ← drivers touching HW
   ├───────────────────────────────────────────┤
   │      HARDWARE  (MCU + peripherals)         │  ← the metal
   └───────────────────────────────────────────┘
    </div>
    <p>This is the <b>AUTOSAR Classic</b> layered architecture. The goal: application code doesn't care which MCU it runs on — lower layers abstract the hardware.</p>

    <h3>Key layers explained</h3>
    <ul class="clean">
      <li><b>MCAL</b> — thin drivers that directly poke MCU registers (ADC, PWM, CAN, GPIO). This is where HW meets SW most directly.</li>
      <li><b>BSW</b> — reusable services: communication stack (CAN/LIN), diagnostics (UDS), memory (NVM), and the <b>OS</b>.</li>
      <li><b>RTE</b> — generated glue that connects software components to each other and to BSW.</li>
      <li><b>SWC (App)</b> — your functional logic, written to be hardware-independent.</li>
    </ul>

    <div class="callout tip">
      <span class="label">AUTOSAR Classic vs. Adaptive</span>
      <b>Classic</b> = deeply embedded, real-time, C, one binary (engine, brakes). <b>Adaptive</b> = high-performance (Linux/POSIX, C++, service-oriented) for ADAS/infotainment. Most integration training starts with Classic.
    </div>

    <h3>RTOS concepts (real-time operating system)</h3>
    <p>Automotive SW runs on an RTOS (e.g. AUTOSAR OS / OSEK). You must grasp:</p>
    <table>
      <tr><th>Concept</th><th>Meaning</th></tr>
      <tr><td><b>Task</b></td><td>A unit of work scheduled to run (often periodically, e.g. every 10 ms)</td></tr>
      <tr><td><b>Priority</b></td><td>Higher-priority tasks preempt lower ones</td></tr>
      <tr><td><b>ISR</b></td><td>Interrupt Service Routine — runs immediately on a HW event</td></tr>
      <tr><td><b>Scheduling</b></td><td>How the OS decides what runs next (priority-based, preemptive)</td></tr>
      <tr><td><b>Cycle time</b></td><td>How often a task repeats — critical for control loops</td></tr>
    </table>

    <div class="callout warn">
      <span class="label">Timing is king</span>
      In real-time systems, being <b>late</b> can be as bad as being <b>wrong</b>. A brake calculation that's correct but 50 ms late is a defect. Integration verifies tasks meet their deadlines.
    </div>

    <h3>Startup & memory</h3>
    <ul class="clean">
      <li><b>Startup code</b> — runs before <code>main()</code>: sets stack, clocks, copies init data to RAM.</li>
      <li><b>Linker script</b> — decides where code/data land in the memory map.</li>
      <li><b>Bootloader</b> — small program that can reflash the application (used in the field via UDS).</li>
    </ul>

    <div class="quiz" data-answer="0">
      <div class="q">Q: In the AUTOSAR layered stack, which layer directly touches MCU peripheral registers?</div>
      <div class="opt" data-i="0">MCAL</div>
      <div class="opt" data-i="1">RTE</div>
      <div class="opt" data-i="2">The Application (SWC)</div>

{
  id:"process",
  icon:"⚙️",
  title:"4. The Integration Process",
  html:`
    <h2>⚙️ The Integration Process — Step by Step</h2>
    <p class="lead">This is the heart of your training: how firmware actually gets onto hardware and made to run.</p>

    <h3>From source code to running ECU</h3>
    <div class="flow">
      <div class="step">Source (.c/.h)</div><span class="arr">→</span>
      <div class="step">Compiler</div><span class="arr">→</span>
      <div class="step">Object files</div><span class="arr">→</span>
      <div class="step">Linker</div><span class="arr">→</span>
      <div class="step">Binary (.hex/.elf)</div><span class="arr">→</span>
      <div class="step">Flash tool</div><span class="arr">→</span>
      <div class="step">Running ECU</div>
    </div>

    <h3>The toolchain</h3>
    <ul class="clean">
      <li><b>Compiler</b> — turns C into machine code for the target MCU (e.g. TASKING, GHS, GCC).</li>
      <li><b>Linker</b> — combines objects + places them in memory per the linker script.</li>
      <li><b>Build system</b> — Make/CMake/vendor scripts that automate the above.</li>
      <li><b>Static analysis</b> — MISRA C checkers catch unsafe code before it runs.</li>
    </ul>

    <h3>Flashing / programming the ECU</h3>
    <table>
      <tr><th>Method</th><th>How</th><th>When</th></tr>
      <tr><td><b>Debugger (JTAG/DAP)</b></td><td>Direct via debug probe (Lauterbach, etc.)</td><td>Bench / development</td></tr>
      <tr><td><b>Bootloader (UDS)</b></td><td>Over CAN/Ethernet into the app area</td><td>Production & field updates</td></tr>
    </table>

    <h3>Board bring-up sequence</h3>
    <p>When new hardware arrives, you bring it up in small, verifiable steps:</p>
    <ol>
      <li><b>Power</b> — confirm correct voltages at the right pins.</li>
      <li><b>Clock & reset</b> — MCU comes out of reset, clock is stable.</li>
      <li><b>Debug connection</b> — probe can connect and halt the core.</li>
      <li><b>"Blinky"</b> — the minimal program: toggle one GPIO/LED. Proves clock + toolchain + flash all work.</li>
      <li><b>Peripherals one by one</b> — UART (print!), then ADC, then CAN…</li>
      <li><b>Communication</b> — send/receive one CAN frame successfully.</li>
      <li><b>Full application</b> — integrate the real software incrementally.</li>
    </ol>

    <div class="callout key">
      <span class="label">Golden rule of integration</span>
      <b>Change one thing at a time.</b> Integrate incrementally, verify each step. When something breaks, you know exactly what caused it. Big-bang integration = debugging nightmare.
    </div>

    <h3>Initialization order matters</h3>
    <div class="callout warn">
      <span class="label">Classic trap</span>
      Using a peripheral before its clock/pin is configured = silent failure. Startup order (clocks → pins → peripherals → interrupts → app) is a frequent bug source.
    </div>

    <h3>Configuration management</h3>
    <ul class="clean">
      <li>Version control everything: source, config, calibration, build scripts.</li>
      <li>Traceability: which binary contains which changes, tied to requirements.</li>
      <li>Reproducible builds: the same inputs must produce the same binary.</li>
    </ul>

    <div class="quiz" data-answer="3">
      <div class="q">Q: What is the very first "software" milestone that proves your toolchain, flash, and clock all work on new hardware?</div>
      <div class="opt" data-i="0">Full application running</div>
      <div class="opt" data-i="1">Passing all HIL tests</div>
      <div class="opt" data-i="2">Sending 100 CAN frames/sec</div>
      <div class="opt" data-i="3">A "blinky" — toggling a single GPIO/LED</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('process',this.checked)" id="chk-process">
      <label for="chk-process">I can walk through code→binary→flash and the bring-up sequence.</label>
    </div>
  `
},
{
  id:"debug",
  icon:"🐞",
  title:"5. Debugging & Tools",
  html:`
    <h2>🐞 Debugging & Tools of the Trade</h2>
    <p class="lead">Integration is 20% making it work and 80% figuring out why it doesn't. Know your tools.</p>

    <h3>The toolkit</h3>
    <table>
      <tr><th>Tool</th><th>Purpose</th></tr>
      <tr><td><b>Debugger</b> (Lauterbach TRACE32, iSYSTEM)</td><td>Halt CPU, set breakpoints, inspect memory/registers, step code</td></tr>
      <tr><td><b>CANoe / CANalyzer</b> (Vector)</td><td>Watch, log, and simulate CAN/LIN/Ethernet traffic</td></tr>
      <tr><td><b>Oscilloscope</b></td><td>See real electrical signals over time (timing, glitches)</td></tr>
      <tr><td><b>Logic analyzer</b></td><td>Decode digital buses (SPI/I²C) as data</td></tr>
      <tr><td><b>Multimeter</b></td><td>Check voltages, continuity, shorts</td></tr>
    </table>

    <h3>What a debugger gives you</h3>
    <ul class="clean">
      <li><b>Breakpoints</b> — pause execution at a line.</li>
      <li><b>Watchpoints</b> — pause when a variable/address changes.</li>
      <li><b>Memory & register view</b> — see the true state of the MCU.</li>
      <li><b>Trace</b> — a recorded history of what the CPU executed (great for timing/rare bugs).</li>
      <li><b>Single-step</b> — run one instruction/line at a time.</li>
    </ul>

    <div class="callout tip">
      <span class="label">Software vs. hardware bug?</span>
      Golden question during integration: is this a <b>code</b> problem or a <b>board/signal</b> problem? The scope + CANoe tell you what's physically happening; the debugger tells you what the code thinks is happening. Compare the two.
    </div>

    <h3>Diagnostics: DTCs</h3>
    <p>ECUs store <b>DTCs</b> (Diagnostic Trouble Codes) when something goes wrong. Using UDS you can read and clear them — a core integration/diagnostic skill.</p>
    <div class="diagram">
   Fault occurs ─▶ ECU sets a DTC ─▶ stored in fault memory
                                        │
   Tester (UDS) ◀── read DTCs ─────────┘
   Tester ── clear DTCs ──▶ memory reset (after fix)
    </div>

    <h3>Common integration bugs & where to look</h3>
    <details><summary>▸ "The peripheral does nothing"</summary>Check pin mux, clock enable to that peripheral, and init order. 90% of the time it's config, not hardware.</details>
    <details><summary>▸ "CAN messages not received"</summary>Check baud rate match, termination resistors (120Ω × 2), transceiver enable pin, and the DBC/message filter config.</details>
    <details><summary>▸ "Random resets"</summary>Watchdog not kicked, stack overflow, or power brown-out. Scope the supply; check stack usage.</details>
    <details><summary>▸ "Works cold, fails when warm / intermittent"</summary>Likely hardware/timing/EMC. Reach for the scope, not the debugger.</details>
    <details><summary>▸ "Timing/jitter issues"</summary>Use trace to see task execution; an ISR may be starving a task or a lower-priority task is blocked.</details>

    <div class="callout warn">
      <span class="label">Debugging discipline</span>
      Form a hypothesis → make one change → observe → keep or revert. Never change five things at once "hoping". Keep notes; intermittent bugs need a paper trail.
    </div>

    <div class="quiz" data-answer="2">
      <div class="q">Q: An ECU works fine cold but fails intermittently once the engine bay heats up. Best first tool?</div>
      <div class="opt" data-i="0">Add more print statements</div>
      <div class="opt" data-i="1">Rewrite the application logic</div>
      <div class="opt" data-i="2">Oscilloscope / hardware measurement (likely a physical/timing/EMC issue)</div>
      <div class="opt" data-i="3">Clear the DTCs and hope</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('debug',this.checked)" id="chk-debug">
      <label for="chk-debug">I know the core debug tools and how to isolate HW vs SW faults.</label>
    </div>
  `
},

  html:`
    <h2>🧪 Testing & Validation</h2>
    <p class="lead">Integration isn't done until it's verified. Know the "-in-the-loop" family.</p>

    <h3>The X-in-the-Loop ladder</h3>
    <table>
      <tr><th>Level</th><th>What runs</th><th>Hardware?</th><th>Use</th></tr>
      <tr><td><b>MIL</b> (Model)</td><td>The control model (e.g. Simulink)</td><td>None</td><td>Early algorithm check</td></tr>
      <tr><td><b>SIL</b> (Software)</td><td>Compiled code on a PC</td><td>None</td><td>Verify code logic</td></tr>
      <tr><td><b>PIL</b> (Processor)</td><td>Code on the target MCU</td><td>Chip only</td><td>Catch compiler/target issues</td></tr>
      <tr><td><b>HIL</b> (Hardware)</td><td>Real ECU + simulated car</td><td>Full ECU</td><td>Integration & system test</td></tr>
    </table>

    <div class="callout key">
      <span class="label">HIL is central to integration</span>
      A <b>HIL rig</b> connects the real ECU to a simulator that fakes sensors, actuators, and the rest of the vehicle in real time. You test the ECU safely, repeatably, and automatically — including dangerous fault scenarios.
    </div>

    <div class="diagram">
   ┌──────────────┐        ┌─────────────────────┐
   │  REAL ECU    │◀──────▶│   HIL Simulator     │
   │ (under test) │  CAN/  │ - fakes sensors     │
   │              │  wires │ - fakes actuators   │
   │              │        │ - models the car    │
   └──────────────┘        │ - injects faults    │
                           └─────────────────────┘
    </div>

    <h3>Types of tests you'll run</h3>
    <ul class="clean">
      <li><b>Functional</b> — does the feature do what the requirement says?</li>
      <li><b>Interface/comm</b> — are CAN signals sent/received correctly & on time?</li>
      <li><b>Fault injection</b> — cut a wire, short a sensor: does the ECU react safely (set DTC, safe state)?</li>
      <li><b>Timing/real-time</b> — do tasks meet deadlines under load?</li>
      <li><b>Robustness/stress</b> — voltage dips, bus flooding, boundary values.</li>
      <li><b>EMC awareness</b> — behavior under electrical noise (usually specialized labs).</li>
    </ul>

    <div class="callout tip">
      <span class="label">Traceability</span>
      Every requirement should map to at least one test. "Requirement ↔ Test ↔ Result" traceability is mandatory in ASPICE and safety work — auditors will ask.
    </div>

    <div class="quiz" data-answer="1">
      <div class="q">Q: You need to verify the real ECU reacts safely to a shorted sensor — without risking a real car. Which setup?</div>
      <div class="opt" data-i="0">MIL (model-in-the-loop)</div>
      <div class="opt" data-i="1">HIL with fault injection</div>
      <div class="opt" data-i="2">SIL on a laptop</div>
      <div class="opt" data-i="3">A code review</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('test',this.checked)" id="chk-test">
      <label for="chk-test">I understand MIL/SIL/PIL/HIL and fault-injection testing.</label>
    </div>
  `

{
  id:"safety",
  icon:"🛡️",
  title:"7. Safety, Security & Process",
  html:`
    <h2>🛡️ Safety, Security & Process</h2>
    <p class="lead">Automotive is heavily regulated. Integration must respect the standards or the product can't ship.</p>

    <h3>The standards map</h3>
    <table>
      <tr><th>Standard</th><th>Topic</th><th>One-liner</th></tr>
      <tr><td><b>ISO 26262</b></td><td>Functional safety</td><td>Prevent harm from E/E failures (ASIL A–D)</td></tr>
      <tr><td><b>ASPICE</b></td><td>Process quality</td><td>How maturely you develop (traceability, reviews)</td></tr>
      <tr><td><b>ISO 21434</b></td><td>Cybersecurity</td><td>Protect vehicle from cyber threats</td></tr>
      <tr><td><b>AUTOSAR</b></td><td>SW architecture</td><td>Standardized layered software</td></tr>
      <tr><td><b>MISRA C</b></td><td>Coding rules</td><td>Safe subset of C to avoid dangerous constructs</td></tr>
    </table>

    <h3>Functional safety in integration</h3>
    <p><b>ASIL</b> (Automotive Safety Integrity Level) rates how dangerous a failure is — <b>ASIL D</b> is the strictest (e.g. steering, braking). Higher ASIL = more rigor. Safety mechanisms you'll integrate & verify:</p>
    <ul class="clean">
      <li><b>Watchdog</b> — detects a hung CPU and forces a reset/safe state.</li>
      <li><b>Lockstep cores</b> — two cores run the same code; mismatch = fault.</li>
      <li><b>ECC memory</b> — detects/corrects bit errors.</li>
      <li><b>Plausibility checks</b> — is this sensor value physically believable?</li>
      <li><b>Safe state</b> — a defined fallback when a fault is detected.</li>
    </ul>

    <div class="callout key">
      <span class="label">"Safe state" mindset</span>
      When something goes wrong, the system must fail into a <b>defined safe condition</b> — not do something unpredictable. Much of integration testing exists to prove the safe state actually triggers.
    </div>

    <h3>Cybersecurity touchpoints</h3>
    <ul class="clean">
      <li>Secure boot — only signed firmware runs.</li>
      <li>Authenticated diagnostics/flashing (no unauthorized reprogramming).</li>
      <li>Message authentication on critical buses.</li>
    </ul>

    <h3>Process artifacts you'll produce</h3>
    <ul class="clean">
      <li>Integration plan & incremental integration strategy</li>
      <li>Integration test cases + results (with traceability)</li>
      <li>Defect/change tracking (every bug logged, triaged, closed)</li>
      <li>Release notes / integration report per software version</li>
    </ul>

    <div class="quiz" data-answer="0">
      <div class="q">Q: Which standard defines functional safety and the ASIL A–D classification?</div>
      <div class="opt" data-i="0">ISO 26262</div>
      <div class="opt" data-i="1">ISO 21434</div>
      <div class="opt" data-i="2">MISRA C</div>
      <div class="opt" data-i="3">ASPICE</div>
      <div class="feedback"></div>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('safety',this.checked)" id="chk-safety">
      <label for="chk-safety">I can name the key standards and the concept of a safe state / ASIL.</label>
    </div>
  `
},
{

  html:`
    <h2>📖 Glossary & Quick Cheat Sheet</h2>
    <p class="lead">Print this. These are the terms you'll hear every day.</p>

    <h3>Acronyms</h3>
    <table>
      <tr><th>Term</th><th>Meaning</th></tr>
      <tr><td>ECU</td><td>Electronic Control Unit — an in-car embedded computer</td></tr>
      <tr><td>MCU</td><td>Microcontroller — the processor inside an ECU</td></tr>
      <tr><td>MCAL</td><td>MicroController Abstraction Layer — lowest AUTOSAR SW layer (drivers)</td></tr>
      <tr><td>BSW</td><td>Basic Software — reusable services (comm, diag, memory, OS)</td></tr>
      <tr><td>RTE</td><td>Runtime Environment — glue between app and BSW</td></tr>
      <tr><td>SWC</td><td>Software Component — an application unit</td></tr>
      <tr><td>CAN</td><td>Controller Area Network — main vehicle bus</td></tr>
      <tr><td>LIN</td><td>Local Interconnect Network — cheap low-speed bus</td></tr>
      <tr><td>DBC</td><td>Database CAN — file mapping signals to CAN frame bits</td></tr>
      <tr><td>UDS</td><td>Unified Diagnostic Services (ISO 14229)</td></tr>
      <tr><td>DTC</td><td>Diagnostic Trouble Code — stored fault code</td></tr>
      <tr><td>XCP</td><td>Universal Measurement & Calibration Protocol</td></tr>
      <tr><td>HIL</td><td>Hardware-in-the-Loop testing</td></tr>
      <tr><td>ASIL</td><td>Automotive Safety Integrity Level (A–D)</td></tr>
      <tr><td>OEM</td><td>Original Equipment Manufacturer (the carmaker)</td></tr>
      <tr><td>Tier 1</td><td>Direct supplier to the OEM (often builds ECUs)</td></tr>
    </table>

    <h3>One-page mental model</h3>
    <div class="diagram">
  BUILD (left of V)                 TEST (right of V)
  ─────────────────                 ────────────────
  Requirements                      Vehicle test
    System design                     System integration
      SW/HW arch      ─── HW/SW ───▶   Integration test
        Module design    INTEGRATION   Unit test
          Code / Board  ───lives here

  ECU = MCU + Flash + RAM + power + watchdog + transceivers
  Stack = App ▶ RTE ▶ BSW ▶ MCAL ▶ Hardware
  Buses = LIN < CAN < CAN-FD < FlexRay < Ethernet
  Test  = MIL ▶ SIL ▶ PIL ▶ HIL
  Rules = ISO 26262 (safety) · 21434 (security) · ASPICE (process) · MISRA (code)
    </div>

    <h3>Golden rules recap</h3>
    <ul class="clean">
      <li>Integrate incrementally — one change at a time.</li>
      <li>Blinky first, then peripherals, then comms, then app.</li>
      <li>Compare "what code thinks" (debugger) vs "what's physical" (scope/CANoe).</li>
      <li>Init order: clocks → pins → peripherals → interrupts → app.</li>
      <li>Every requirement traces to a test.</li>
      <li>Design for a safe state on failure.</li>
    </ul>

    <div class="callout tip">
      <span class="label">Next step to teach it well</span>
      Prepare 2–3 live demos: (1) a CANoe trace showing signals, (2) flashing + blinky with a debugger, (3) reading/clearing a DTC. Hands-on demos make integration "click" for trainees.
    </div>

    <div class="card" style="text-align:center">
      <h3 style="margin-top:0">🏁 You've reached the end</h3>
      <p>Complete all modules above and you'll have the full foundation to teach HW/SW integration.</p>
      <p id="finalscore" style="font-size:1.1rem; color:var(--accent)"></p>
    </div>

    <div class="checkbox">
      <input type="checkbox" onchange="markDone('glossary',this.checked)" id="chk-glossary">
      <label for="chk-glossary">I've reviewed the glossary and cheat sheet.</label>
    </div>
  `
}
];

/* ============================================================
   APP LOGIC
   ============================================================ */
const navlist = document.getElementById('navlist');
const content = document.getElementById('content');
let current = 0;
const STORE = 'hwsw-progress-v1';

function loadProgress(){ try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}} }
function saveProgress(p){ localStorage.setItem(STORE, JSON.stringify(p)); }
let progress = loadProgress();

function buildNav(){
  navlist.innerHTML='';
  modules.forEach((m,i)=>{
    const el=document.createElement('div');
    el.className='navlink'+(progress[m.id]?' done':'');
    el.dataset.i=i;
    el.innerHTML=`<span class="num">${i}</span><span>${m.icon} ${m.title.replace(/^\\d+\\.\\s*/,'')}</span>`;
    el.onclick=()=>show(i);
    navlist.appendChild(el);
  });
}

function render(i){
  content.innerHTML = modules[i].html;
  // nav buttons
  const nav=document.createElement('div');
  nav.className='navbtns';
  nav.innerHTML=`
    <button ${i===0?'disabled':''} onclick="show(${i-1})">← Previous</button>
    <button ${i===modules.length-1?'disabled':''} onclick="show(${i+1})">Next →</button>`;
  content.appendChild(nav);
  // restore checkbox
  const chk=document.getElementById('chk-'+modules[i].id);
  if(chk) chk.checked=!!progress[modules[i].id];
  wireQuizzes();
  updateFinalScore();
  window.scrollTo(0,0);
}

function show(i){
  if(i<0||i>=modules.length) return;
  current=i;
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));
  render(i);
  updateProgressBar();
}

function wireQuizzes(){
  content.querySelectorAll('.quiz').forEach(q=>{
    const ans=+q.dataset.answer;
    const fb=q.querySelector('.feedback');
    q.querySelectorAll('.opt').forEach(opt=>{
      opt.onclick=()=>{
        if(q.dataset.answered) return;
        q.dataset.answered='1';
        const chosen=+opt.dataset.i;
        q.querySelectorAll('.opt').forEach(o=>{
          if(+o.dataset.i===ans) o.classList.add('correct');
        });
        if(chosen!==ans){ opt.classList.add('wrong'); fb.style.color='var(--danger)';
          fb.textContent='Not quite — the highlighted answer is correct. Review the section above.'; }
        else{ fb.style.color='var(--accent)'; fb.textContent='✓ Correct!'; }
        fb.style.display='block';
      };
    });
  });
}

function markDone(id,val){
  progress[id]=val; saveProgress(progress);
  buildNav();
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',+n.dataset.i===current));
  updateProgressBar(); updateFinalScore();
}

function updateProgressBar(){
  const done=modules.filter(m=>progress[m.id]).length;
  document.getElementById('progbar').style.width=(done/modules.length*100)+'%';
}

function updateFinalScore(){
  const el=document.getElementById('finalscore');
  if(!el) return;
  const done=modules.filter(m=>progress[m.id]).length;
  el.textContent=`Progress: ${done} / ${modules.length} modules completed`+(done===modules.length?'  🎉':'');
}

function resetProgress(){
  if(!confirm('Reset all progress and quiz completion?')) return;
  progress={}; saveProgress(progress); buildNav(); show(current); updateProgressBar();
}

buildNav();
show(0);
updateProgressBar();
</script>
</body>
</html>
