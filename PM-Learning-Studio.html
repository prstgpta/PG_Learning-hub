<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Learning Studio — Master Product Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122730; --ink-2:#0C1B22; --ink-3:#1B3A46;
  --paper:#F1ECE0; --paper-2:#FBF8F1; --paper-3:#ffffff;
  --signal:#E7A23C; --signal-deep:#C9812A;
  --go:#3F8C79; --alert:#C24B3A; --plum:#7C5C8E; --blue:#3E6E8E;
  --text:#20323A; --muted:#5C6B70;
  --line:rgba(18,39,48,.14); --line-light:rgba(241,236,224,.16);
  --shadow:0 24px 60px -30px rgba(0,0,0,.55);
  --shadow-sm:0 6px 20px -12px rgba(0,0,0,.5);
  --sidebar-w:288px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -8%,rgba(231,162,60,.10),transparent 42%),radial-gradient(circle at 92% 4%,rgba(63,140,121,.10),transparent 46%);
}
h1,h2,h3,h4,h5{font-family:"Archivo",system-ui,sans-serif;font-weight:800;line-height:1.12;margin:0}
.mono{font-family:"Space Mono",monospace}
a{color:var(--signal-deep)}
button{font-family:inherit}
::selection{background:var(--signal);color:var(--ink)}

/* ---------- App layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink-2);border-right:1px solid var(--line-light);padding:20px 14px 40px;display:flex;flex-direction:column;gap:6px;z-index:40}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(241,236,224,.14);border-radius:8px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;border-bottom:1px solid var(--line-light);margin-bottom:8px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--signal),var(--signal-deep));display:grid;place-items:center;font-family:"Archivo";font-weight:900;color:var(--ink);flex:none;font-size:18px}
.brand b{font-family:"Archivo";font-size:15px;letter-spacing:.02em;color:var(--paper);display:block;line-height:1.1}
.brand span{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
.nav-group-label{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:rgba(241,236,224,.78);text-decoration:none;font-family:"Archivo";font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;transition:.15s;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(241,236,224,.05);color:var(--paper)}
.nav-item.active{background:rgba(231,162,60,.14);border-color:rgba(231,162,60,.35);color:var(--signal)}
.nav-item .ic{width:22px;text-align:center;flex:none;font-size:15px}
.nav-item .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid rgba(241,236,224,.28);flex:none}
.nav-item.done .dot{background:var(--go);border-color:var(--go)}
.nav-num{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);width:22px;text-align:center;flex:none}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(12,27,34,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-light);padding:12px 26px;display:flex;align-items:center;gap:16px}
.hamburger{display:none;background:none;border:1px solid var(--line-light);color:var(--paper);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer}
.progress-wrap{flex:1;max-width:520px}
.progress-top{display:flex;justify-content:space-between;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.05em;color:rgba(241,236,224,.75);margin-bottom:5px}
.progress-bar{height:8px;background:rgba(241,236,224,.12);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--go));border-radius:100px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-family:"Archivo";font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;border:1px solid var(--line-light);background:rgba(241,236,224,.04);color:var(--paper);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--signal);color:var(--signal)}
.btn.primary{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.btn.primary:hover{background:var(--signal-deep);color:var(--ink)}
.btn.ghost-danger:hover{border-color:var(--alert);color:var(--alert)}

.content{padding:34px 40px 90px;max-width:1080px;width:100%;margin:0 auto}
@media(max-width:1180px){.content{padding:30px 26px 80px}}

/* ---------- Sheets & typography ---------- */
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{background:var(--paper);color:var(--text);border-radius:18px;padding:34px 38px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.4);margin-bottom:22px}
@media(max-width:640px){.sheet{padding:24px 20px;border-radius:14px}}
.sheet h2{font-size:clamp(1.6rem,3.4vw,2.3rem);color:var(--ink);margin:.1em 0 .35em;letter-spacing:-.01em}
.sheet h3{font-size:1.28rem;color:var(--ink);margin:1.5em 0 .4em}
.sheet h4{font-size:1.02rem;color:var(--ink);margin:1.1em 0 .3em}
.sheet p{margin:.6em 0}
.sheet ul,.sheet ol{margin:.6em 0;padding-left:1.3em}
.sheet li{margin:.35em 0}
.sheet strong,.sheet b{color:var(--ink)}
.eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal-deep);display:flex;align-items:center;gap:12px;margin:0 0 12px}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--signal)}
.lead{font-size:1.1rem;color:#33454c}

/* callouts */
.note{border-left:4px solid var(--signal);background:rgba(231,162,60,.10);padding:13px 17px;border-radius:0 10px 10px 0;margin:16px 0;font-size:.97rem}
.note.do{border-color:var(--go);background:rgba(63,140,121,.10)}
.note.dont{border-color:var(--alert);background:rgba(194,75,58,.09)}
.note.key{border-color:var(--plum);background:rgba(124,92,142,.10)}
.note .lbl{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;color:var(--muted)}
.note.do .lbl{color:var(--go)}.note.dont .lbl{color:var(--alert)}.note.key .lbl{color:var(--plum)}

blockquote{margin:20px 0;padding:18px 22px;background:var(--ink);color:var(--paper);border-radius:12px}
blockquote p{font-size:1.1rem;line-height:1.5;margin:0}
blockquote cite{display:block;margin-top:10px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;font-style:normal;color:var(--signal)}

/* grids & cards */
.grid{display:grid;gap:16px;margin:20px 0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:13px;padding:18px}
.card .tag{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-deep)}
.card h4{margin:.3em 0 .25em}
.card p{font-size:.94rem;margin:.25em 0;color:#3c4c53}
.card.click{cursor:pointer;transition:.15s}
.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);border-color:var(--signal)}

/* tables */
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.94rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td b{color:var(--ink)}
tr:last-child td{border-bottom:none}

.chip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:7px;background:var(--ink);color:var(--signal);font-family:"Archivo";font-weight:700;font-size:.85rem}
.pill{display:inline-block;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
.pill.go{color:var(--go);border-color:rgba(63,140,121,.4);background:rgba(63,140,121,.08)}
.pill.sig{color:var(--signal-deep);border-color:rgba(201,129,42,.4);background:rgba(231,162,60,.1)}
.pill.plum{color:var(--plum);border-color:rgba(124,92,142,.4);background:rgba(124,92,142,.08)}
.pill.blue{color:var(--blue);border-color:rgba(62,110,142,.4);background:rgba(62,110,142,.08)}

/* accordion */
.acc{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;background:var(--paper-2)}
.acc-head{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;font-family:"Archivo";font-weight:700;color:var(--ink);font-size:1.02rem;user-select:none}
.acc-head:hover{background:rgba(231,162,60,.06)}
.acc-head .caret{margin-left:auto;transition:.2s;color:var(--muted);flex:none}
.acc.open .acc-head .caret{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 18px}
.acc.open .acc-body{max-height:2000px;padding:0 18px 16px}
.acc-body p:first-child{margin-top:0}

/* ---------- Dashboard ---------- */
.hero-dash{background:linear-gradient(135deg,var(--ink-3),var(--ink-2));border:1px solid var(--line-light);color:var(--paper);border-radius:20px;padding:38px 40px;margin-bottom:24px;position:relative;overflow:hidden}
.hero-dash h1{font-size:clamp(2rem,4.5vw,3.1rem);letter-spacing:-.02em;margin-bottom:12px}
.hero-dash h1 em{font-style:normal;color:var(--signal)}
.hero-dash p{color:rgba(241,236,224,.85);font-size:1.12rem;max-width:44em}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
@media(max-width:760px){.stat-row{grid-template-columns:1fr 1fr}}
.stat{background:rgba(241,236,224,.05);border:1px solid var(--line-light);border-radius:13px;padding:16px 18px}
.stat .n{font-family:"Archivo";font-weight:800;font-size:1.9rem;color:var(--signal)}
.stat .l{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,236,224,.7)}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mod-card{background:var(--paper);color:var(--text);border-radius:15px;padding:20px;cursor:pointer;transition:.18s;border:1px solid rgba(255,255,255,.4);box-shadow:var(--shadow-sm);position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px}
.mod-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.mod-card .mc-ic{font-size:26px}
.mod-card .mc-num{position:absolute;top:16px;right:18px;font-family:"Space Mono",monospace;font-size:12px;color:var(--muted)}
.mod-card h3{color:var(--ink);font-size:1.12rem}
.mod-card p{font-size:.9rem;color:#4a5a61;margin:0;flex:1}
.mod-card .mc-foot{display:flex;align-items:center;gap:8px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mod-card .mc-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.mod-card.done .mc-check{background:var(--go);border-color:var(--go);color:#fff}

/* ---------- Quiz ---------- */
.quiz-box{background:var(--ink);color:var(--paper);border-radius:16px;padding:26px 30px;margin-top:24px}
.quiz-box h3{color:var(--signal);margin-bottom:4px}
.quiz-q{margin:18px 0}
.quiz-q .qtext{font-family:"Archivo";font-weight:700;font-size:1.05rem;margin-bottom:12px;display:flex;gap:10px}
.quiz-opt{display:block;width:100%;text-align:left;padding:12px 15px;margin:8px 0;border-radius:10px;border:1px solid var(--line-light);background:rgba(241,236,224,.04);color:var(--paper);cursor:pointer;transition:.15s;font-size:.98rem;font-family:"Newsreader",serif}
.quiz-opt:hover{border-color:var(--signal)}
.quiz-opt.correct{background:rgba(63,140,121,.22);border-color:var(--go)}
.quiz-opt.wrong{background:rgba(194,75,58,.2);border-color:var(--alert)}
.quiz-opt.disabled{pointer-events:none;opacity:.65}
.quiz-opt .mk{float:right;font-weight:700}
.quiz-explain{font-size:.92rem;color:rgba(241,236,224,.82);margin-top:8px;padding:10px 14px;border-left:3px solid var(--signal);background:rgba(231,162,60,.08);border-radius:0 8px 8px 0;display:none}
.quiz-explain.show{display:block}
.quiz-result{margin-top:20px;padding:18px;border-radius:12px;background:rgba(241,236,224,.06);text-align:center;display:none}
.quiz-result.show{display:block}
.quiz-result .score{font-family:"Archivo";font-weight:900;font-size:2.4rem;color:var(--signal)}

/* ---------- Flashcards ---------- */
.fc-stage{perspective:1400px;max-width:560px;margin:24px auto}
.fc{position:relative;width:100%;height:320px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.fc-front{background:var(--paper);color:var(--ink)}
.fc-back{background:var(--ink-3);color:var(--paper);transform:rotateY(180deg)}
.fc-face .kind{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal-deep);margin-bottom:14px}
.fc-back .kind{color:var(--signal)}
.fc-face .term{font-family:"Archivo";font-weight:800;font-size:1.7rem;margin-bottom:8px}
.fc-face .def{font-size:1.02rem;line-height:1.5}
.fc-face .hint{position:absolute;bottom:16px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.fc-controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px}
.fc-count{font-family:"Space Mono",monospace;font-size:13px;color:rgba(241,236,224,.75);min-width:80px;text-align:center}

/* ---------- Glossary / search ---------- */
.searchbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.searchbar input{flex:1;min-width:200px;padding:12px 16px;border-radius:11px;border:1px solid var(--line);background:var(--paper-2);color:var(--text);font-family:"Newsreader",serif;font-size:1rem}
.searchbar input:focus{outline:2px solid var(--signal)}
.filter-tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.ftag{font-family:"Space Mono",monospace;font-size:11px;padding:6px 12px;border-radius:100px;border:1px solid var(--line-light);background:rgba(241,236,224,.04);color:rgba(241,236,224,.8);cursor:pointer}
.ftag.active{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.term-row{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:13px 4px;border-bottom:1px dotted var(--line)}
.term-row:last-child{border:none}
.term-row dt{font-family:"Archivo";font-weight:700;color:var(--ink);font-size:1rem}
.term-row dt .cat{display:block;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-deep);margin-top:3px}
.term-row dd{margin:0;font-size:.96rem;color:#3c4c53}
@media(max-width:640px){.term-row{grid-template-columns:1fr;gap:3px}}
.empty{padding:30px;text-align:center;color:var(--muted);font-family:"Space Mono",monospace;font-size:13px}

/* ---------- Interview bank ---------- */
.iv-item{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.iv-q{padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;font-family:"Archivo";font-weight:700;color:var(--ink);font-size:1.02rem}
.iv-q:hover{background:rgba(231,162,60,.06)}
.iv-q .cat{margin-left:auto}
.iv-a{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 18px}
.iv-item.open .iv-a{max-height:1400px;padding:0 18px 18px}
.iv-a .approach{font-size:.95rem;color:#3c4c53}
.iv-a h5{font-family:"Archivo";color:var(--ink);margin:12px 0 4px;font-size:.95rem}

/* ---------- RICE calc ---------- */
.calc{background:var(--ink);color:var(--paper);border-radius:16px;padding:26px 30px;margin:20px 0}
.calc-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
@media(max-width:640px){.calc-row{grid-template-columns:1fr}}
.calc label{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(241,236,224,.75);display:block;margin-bottom:6px}
.calc input,.calc select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line-light);background:rgba(241,236,224,.06);color:var(--paper);font-family:"Space Mono",monospace;font-size:1rem}
.calc-out{margin-top:18px;text-align:center;padding:18px;border-radius:12px;background:rgba(231,162,60,.12);border:1px solid rgba(231,162,60,.3)}
.calc-out .rscore{font-family:"Archivo";font-weight:900;font-size:2.6rem;color:var(--signal)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink-3);color:var(--paper);padding:13px 22px;border-radius:11px;box-shadow:var(--shadow);font-family:"Archivo";font-weight:600;font-size:.95rem;z-index:200;opacity:0;transition:.3s;border:1px solid var(--signal)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.scrim{position:fixed;inset:0;background:rgba(6,14,18,.6);backdrop-filter:blur(3px);z-index:35;display:none}
.scrim.show{display:block}

.footer-note{text-align:center;color:rgba(241,236,224,.5);font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.05em;padding:24px;line-height:1.8}

.next-prev{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.mark-done{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding:18px;border-radius:12px;background:rgba(63,140,121,.1);border:1px solid rgba(63,140,121,.3)}
.mark-done .txt{font-family:"Archivo";font-weight:700;color:var(--ink);font-size:1rem}

@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:var(--sidebar-w);transform:translateX(-105%);transition:transform .28s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:grid;place-items:center}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">P</div>
      <div><b>PM Learning Studio</b><span>Product Management</span></div>
    </div>
    <nav id="nav"><!-- built by JS --></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="progress-wrap">
        <div class="progress-top"><span id="progLabel">Your progress</span><span id="progPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost-danger" id="resetBtn" title="Reset all progress">Reset</button>
      </div>
    </header>
    <main class="content" id="content"><!-- views injected by JS --></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   PM LEARNING STUDIO — data + app logic
   Content distilled from the Product Focus "Product Management
   Journal" series (Vols 1-15) and general PM best practice.
   ================================================================ */
"use strict";

/* placeholder anchors filled incrementally */
const MODULES = [
{
  id:"role", num:1, icon:"🎯", title:"The PM Role & Responsibilities",
  tagline:"What a product manager actually does",
  blurb:"The mission, the boundaries, and the difference between PM, PO and Project Manager.",
  html:`
    <p class="lead">A product manager is the person who makes sure the right product gets built for the right people, for the right business reasons — and that it succeeds in the market. You are the <b>CEO of the product</b> in influence, but almost never in authority. Your power comes from clarity, evidence and trust, not from telling people what to do.</p>

    <div class="note key"><span class="lbl">One-line definition</span>Product management is the discipline of discovering a product that is <b>valuable, usable, feasible and viable</b>, and then leading the whole business to deliver and grow it.</div>

    <h3>The four questions you exist to answer</h3>
    <table>
      <tr><th>Dimension</th><th>The question</th><th>Who you partner with</th></tr>
      <tr><td><b>Valuable</b></td><td>Will customers want it and pay (in money or attention)?</td><td>Customers, Sales, Marketing</td></tr>
      <tr><td><b>Usable</b></td><td>Can people actually use it easily?</td><td>Design / UX</td></tr>
      <tr><td><b>Feasible</b></td><td>Can we build it with the time, tech and people we have?</td><td>Engineering</td></tr>
      <tr><td><b>Viable</b></td><td>Does it work for our business (revenue, cost, strategy, legal)?</td><td>Finance, Legal, Leadership</td></tr>
    </table>
    <p>Marty Cagan calls these the <b>four big risks</b>. Great discovery is simply tackling all four <em>before</em> you spend months building.</p>

    <h3>Two hats: strategic and tactical</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Strategic / Outbound</span><h4>Facing the market</h4><p>Market analysis, customer needs, propositions, pricing, business cases, positioning, roadmap and strategy. "Are we building the right thing?"</p></div>
      <div class="card"><span class="tag">Tactical / Inbound</span><h4>Facing the build</h4><p>Requirements, backlog, working with engineering &amp; design, release readiness, launch. "Are we building the thing right?"</p></div>
    </div>
    <p>The Product Focus model splits this into <b>Market-facing</b> and <b>Product-facing</b> activities. Weak PMs collapse into only the tactical hat (a glorified backlog admin). Strong PMs protect time for the strategic hat.</p>

    <h3>Not the same job: PM vs PO vs Project Manager</h3>
    <table>
      <tr><th>Role</th><th>Owns</th><th>Time horizon</th><th>Core question</th></tr>
      <tr><td><b>Product Manager</b></td><td>The <em>why</em> &amp; <em>what</em> — value &amp; strategy</td><td>Weeks → years</td><td>Are we solving the right problem?</td></tr>
      <tr><td><b>Product Owner</b></td><td>The <em>what next</em> — backlog for the dev team (a Scrum role)</td><td>Sprint → release</td><td>Is the backlog clear and ready?</td></tr>
      <tr><td><b>Project Manager</b></td><td>The <em>when</em> &amp; <em>how</em> — plan, schedule, risk</td><td>Project duration</td><td>Are we on time and on budget?</td></tr>
    </table>
    <div class="note"><span class="lbl">Interview gold</span>In small companies one person wears all three hats. In larger Agile orgs, the PM is strategic and market-facing while the PO is a delivery-focused subset. If asked "PM vs PO?", say: <em>"PO is a Scrum role focused on the backlog; PM is the broader business role responsible for the product's success in the market."</em></div>

    <h3>A week in the life</h3>
    <ul>
      <li><b>Talk to customers &amp; the market</b> — interviews, sales calls, support tickets, data.</li>
      <li><b>Decide &amp; prioritise</b> — what's in, what's out, and why.</li>
      <li><b>Write it down</b> — one-pagers, requirements, roadmap updates.</li>
      <li><b>Unblock the team</b> — answer questions, make trade-off calls fast.</li>
      <li><b>Align stakeholders</b> — sales, marketing, support, leadership, finance.</li>
      <li><b>Measure</b> — did the last thing we shipped move the metric?</li>
    </ul>

    <div class="note do"><span class="lbl">Do</span>Own the outcome even when nobody formally gave you authority. That ownership mindset ("high agency") is what separates a PM from a ticket-taker.</div>
    <div class="note dont"><span class="lbl">Don't</span>Become "the feature factory manager" who just relays stakeholder requests to engineers. If you can't explain the <em>problem</em> behind a feature, you're not doing product management.</div>
  `,
  quiz:[
    {q:"Which set best captures the four risks a PM must de-risk?",opts:["Cheap, fast, good, scalable","Valuable, Usable, Feasible, Viable","Design, Build, Test, Ship","Market, Money, Metrics, Morale"],a:1,ex:"Marty Cagan's four big product risks: value, usability, feasibility and business viability."},
    {q:"A stakeholder says 'build a chatbot'. The strongest PM response is:",opts:["Add it to the sprint immediately","Ask what problem we're solving, for whom, and how we'll know it's real","Refuse — chatbots are outdated","Ask engineering how long it will take"],a:1,ex:"PMs fall in love with the problem, not the solution. Start with the problem and the evidence."},
    {q:"The Product Owner role is best described as:",opts:["The person who owns company strategy","A Scrum role focused on a clear, prioritised backlog for the dev team","The same as a project manager","The person who signs off the budget"],a:1,ex:"PO is a delivery-focused Scrum role. PM is the broader market/business role."},
    {q:"Where does a PM's real power come from?",opts:["Formal authority over engineers","Controlling the budget","Clarity, evidence and trust (influence)","Reporting to the CEO"],a:2,ex:"PMs lead through influence — clear thinking, evidence and relationships — not command."}
  ]
},
{
  id:"mindset", num:2, icon:"🧠", title:"The PM Mindset",
  tagline:"How great product managers think",
  blurb:"Problem-first thinking, outcomes over output, product sense and prioritising by leverage.",
  html:`
    <p class="lead">Frameworks are learnable in a weekend. The <b>mindset</b> is what makes a PM effective — and it's exactly what interviewers probe for. Master these habits and every framework becomes obvious.</p>

    <div class="grid g2">
      <div class="card"><span class="tag">Habit 01</span><h4>Problem first, solution second</h4><p>Fall in love with the problem, stay skeptical of any solution. "What problem, for whom, and how do we know it's real?" comes before "what shall we build?"</p></div>
      <div class="card"><span class="tag">Habit 02</span><h4>Outcomes over output</h4><p>Shipping a feature is output. A changed customer behaviour or business result is the outcome. Measure yourself on outcomes.</p></div>
      <div class="card"><span class="tag">Habit 03</span><h4>Think in hypotheses &amp; evidence</h4><p>"We believe X will cause Y; we'll know because Z metric moves." Opinions start the conversation; evidence ends it.</p></div>
      <div class="card"><span class="tag">Habit 04</span><h4>Prioritise ruthlessly</h4><p>Strategy is deciding what <em>not</em> to do. There are always ten good ideas and time for two. Saying a reasoned "no" is the daily job.</p></div>
      <div class="card"><span class="tag">Habit 05</span><h4>High agency</h4><p>Find a way through the ambiguity, the org and the missing data instead of waiting to be told. You're the owner even when nobody appointed you.</p></div>
      <div class="card"><span class="tag">Habit 06</span><h4>Zoom in and out</h4><p>Hold the 3-year vision and this-sprint bug at once. Move between altitudes without losing either.</p></div>
    </div>

    <div class="note key"><span class="lbl">Shreyas Doshi — the LNO framework</span>Sort every task by leverage. <b>L</b>everage tasks (strategy, a key launch, hiring) deserve your best hours. <b>N</b>eutral tasks deserve competent-and-done. <b>O</b>verhead tasks deserve the minimum to not be a bottleneck. Burnout comes from treating overhead like leverage.</div>

    <h3>"Product sense" — the thing interviewers keep testing</h3>
    <p>Product sense is intuition for what makes a product good, built from deliberate attention. You develop it by: using many products critically ("why did they make <em>that</em> choice?"), reading teardowns, talking to real users constantly, and forming opinions you can <b>defend with a reason</b>, not just taste. It's trainable — it just isn't fast.</p>

    <h3>Output vs Outcome vs Impact</h3>
    <table>
      <tr><th>Level</th><th>Example</th><th>Good target?</th></tr>
      <tr><td><b>Output</b></td><td>"We shipped the new onboarding flow"</td><td>No — that's just activity</td></tr>
      <tr><td><b>Outcome</b></td><td>"Activation rose from 40% to 55%"</td><td>Yes — behaviour changed</td></tr>
      <tr><td><b>Impact</b></td><td>"Retention up drove +£1.2M ARR"</td><td>Yes — business result</td></tr>
    </table>

    <blockquote><p>"Fall in love with the problem, not the solution."</p><cite>— popularised by Uri Levine, co-founder of Waze</cite></blockquote>

    <div class="note dont"><span class="lbl">Don't</span>Confuse being busy with being effective. A crisp one-pager that gets ten people rowing the same way beats any feature you personally spec'd in a vacuum.</div>
  `,
  quiz:[
    {q:"'We shipped a redesigned checkout' is an example of:",opts:["An outcome","An output","An impact","A KPI"],a:1,ex:"Shipping is output (activity). The outcome is the behaviour change it causes."},
    {q:"In Shreyas Doshi's LNO framework, strategy and a major launch are:",opts:["Overhead tasks","Neutral tasks","Leverage tasks","Optional tasks"],a:2,ex:"Leverage tasks deserve your best hours; overhead deserves the minimum."},
    {q:"The best way to build 'product sense' is to:",opts:["Memorise more frameworks","Critically study products and talk to users constantly","Wait for it to come with age","Copy competitors exactly"],a:1,ex:"Product sense is trained by deliberate attention: critique products, read teardowns, talk to users."},
    {q:"A hypothesis-driven PM frames an idea as:",opts:["'This is obviously a great feature'","'We believe X will cause Y; we'll know because Z moves'","'The CEO wants it'","'Competitors have it'"],a:1,ex:"Tie every idea to a testable belief and a metric that would prove it."}
  ]
},
{
  id:"lifecycle", num:3, icon:"🔄", title:"The Product Lifecycle",
  tagline:"Discover → Define → Design → Deliver → Measure",
  blurb:"The continuous loop every other framework plugs into, plus the market lifecycle curve.",
  html:`
    <p class="lead">You never "finish" a product. You run a loop continuously, getting a little less wrong each turn. Two lifecycles matter: the <b>build loop</b> (how you work) and the <b>market lifecycle</b> (how a product ages in the market).</p>

    <h3>The build loop</h3>
    <table>
      <tr><th>Stage</th><th>The question</th><th>Key activities</th><th>Main artifact</th></tr>
      <tr><td><b>Discover</b></td><td>What's a real, painful problem?</td><td>Interviews, data, market research, opportunity mapping</td><td>Problem statement</td></tr>
      <tr><td><b>Define</b></td><td>What does winning look like?</td><td>Target outcome, North Star, success metrics, scope</td><td>PRD / one-pager, OKRs</td></tr>
      <tr><td><b>Design</b></td><td>What's the best solution?</td><td>Ideate, prototype, test assumptions with users</td><td>Prototype, spec</td></tr>
      <tr><td><b>Deliver</b></td><td>How do we ship it well?</td><td>Break into work, unblock, launch (beta → GA)</td><td>Backlog, release, GTM plan</td></tr>
      <tr><td><b>Measure &amp; Learn</b></td><td>Did it work? What now?</td><td>Instrument, read funnels &amp; cohorts, decide to scale/iterate/kill</td><td>Metrics review, decision</td></tr>
    </table>
    <div class="note"><span class="lbl">Continuous, not sequential</span>Drawn as a line for teaching, but it's a loop. In a healthy team <b>discovery never stops</b> — you research the next problem while delivering the current one. Teresa Torres calls this <b>continuous discovery</b>: small research touchpoints every week, not one big phase at the start.</div>

    <h3>Dual-track Agile</h3>
    <p>Modern teams run two parallel tracks: a <b>discovery track</b> (research, prototypes, validating what to build) feeding a <b>delivery track</b> (engineering building validated work). Ideas only cross into delivery once the four risks are reduced.</p>

    <h3>The market lifecycle (the S-curve)</h3>
    <table>
      <tr><th>Phase</th><th>What's happening</th><th>PM focus</th></tr>
      <tr><td><b>Introduction</b></td><td>Launch; few customers; educating the market</td><td>Product/market fit, early adopters, learning fast</td></tr>
      <tr><td><b>Growth</b></td><td>Adoption accelerates; competitors appear</td><td>Scale, differentiate, widen the moat</td></tr>
      <tr><td><b>Maturity</b></td><td>Market saturates; growth flattens</td><td>Efficiency, pricing, retention, new segments</td></tr>
      <tr><td><b>Decline</b></td><td>Demand falls; substitutes take over</td><td>Harvest, reposition, or sunset gracefully</td></tr>
    </table>
    <p>Matched to <b>adoption</b> (Rogers' curve): Innovators → Early Adopters → <em>the chasm</em> → Early Majority → Late Majority → Laggards. Geoffrey Moore's <em>Crossing the Chasm</em> is about the hard leap from early adopters to the pragmatic mainstream.</p>

    <div class="note do"><span class="lbl">Do</span>Know which lifecycle phase your product is in — it changes everything: an Introduction product needs learning and PMF; a Maturity product needs retention and margin.</div>
  `,
  quiz:[
    {q:"'Continuous discovery' means:",opts:["One big research phase before building","Small, regular research touchpoints every week","Only researching after launch","Letting engineers do the research"],a:1,ex:"Teresa Torres: weekly touchpoints with customers, in parallel with delivery."},
    {q:"Dual-track Agile runs which two tracks in parallel?",opts:["Design and marketing","Discovery and delivery","Sales and support","Frontend and backend"],a:1,ex:"A discovery track validates what to build; a delivery track builds validated work."},
    {q:"'Crossing the chasm' refers to the leap between:",opts:["Growth and maturity","Early adopters and the early (pragmatic) majority","Beta and GA","Introduction and decline"],a:1,ex:"Geoffrey Moore's chasm sits between visionary early adopters and the mainstream majority."},
    {q:"A product in the Maturity phase should focus most on:",opts:["Finding product/market fit","Retention, pricing and efficiency","Educating the market from scratch","Recruiting innovators"],a:1,ex:"Mature markets are about margin, retention and squeezing more value, not first-time PMF."}
  ]
},
{
  id:"discovery", num:4, icon:"🔍", title:"Discovery & Market Analysis",
  tagline:"Understand the market, customers and competition",
  blurb:"Customer interviews, jobs-to-be-done, sizing (TAM/SAM/SOM), and competitive analysis.",
  html:`
    <p class="lead">Discovery is how you avoid building the wrong thing. It answers three questions: <b>Is the problem real? Is it big enough? Can we win?</b> Great PMs treat this as a continuous habit, not a one-off phase.</p>

    <h3>Talk to customers — properly</h3>
    <p>The biggest discovery mistake is asking leading questions and pitching your idea. Instead, dig into real past behaviour.</p>
    <div class="note do"><span class="lbl">Do — The Mom Test</span>Ask about their life and specific past events, not your idea. "Walk me through the last time you faced this." Good questions can't be flattered. Talk about <em>their</em> problem, not your solution.</div>
    <div class="note dont"><span class="lbl">Don't</span>Ask "Would you use a product that does X?" People are polite and predict their future behaviour badly. Hypotheticals produce false positives.</div>

    <h3>Jobs To Be Done (JTBD)</h3>
    <p>People don't buy products; they "hire" them to make progress. The classic line: <em>"People don't want a quarter-inch drill, they want a quarter-inch hole"</em> — and really, a picture on the wall. Framing needs as jobs reveals the real competition (sometimes it's "do nothing" or a spreadsheet).</p>
    <p>Template: <b>When</b> [situation], <b>I want to</b> [motivation], <b>so I can</b> [expected outcome].</p>

    <h3>Sizing the market: TAM / SAM / SOM</h3>
    <table>
      <tr><th>Term</th><th>Meaning</th><th>Example</th></tr>
      <tr><td><b>TAM</b></td><td>Total Addressable Market — everyone who could ever need it</td><td>All coffee drinkers worldwide</td></tr>
      <tr><td><b>SAM</b></td><td>Serviceable Available Market — the slice you can actually serve</td><td>Coffee drinkers in your cities</td></tr>
      <tr><td><b>SOM</b></td><td>Serviceable Obtainable Market — what you can realistically win</td><td>Customers near your shops in year 1</td></tr>
    </table>

    <h3>Understand the competition</h3>
    <ul>
      <li><b>Direct</b> competitors solve the same problem the same way. <b>Indirect</b> solve it differently (incl. "do nothing" and spreadsheets).</li>
      <li>Map them on the <b>criteria customers actually care about</b>, not on a feature checklist you invented.</li>
      <li>Watch for the <b>analyst racket</b> — vendor-influenced "quadrants" can mislead. Verify with real buyers.</li>
    </ul>

    <h3>Frameworks to structure analysis</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Macro</span><h4>PESTLE</h4><p>Political, Economic, Social, Technological, Legal, Environmental forces shaping your market.</p></div>
      <div class="card"><span class="tag">Industry</span><h4>Porter's Five Forces</h4><p>Rivalry, new entrants, substitutes, buyer power, supplier power — how attractive/defensible the market is.</p></div>
      <div class="card"><span class="tag">Position</span><h4>SWOT</h4><p>Strengths, Weaknesses (internal) + Opportunities, Threats (external). Simple but easily shallow — force specifics.</p></div>
      <div class="card"><span class="tag">Segment</span><h4>Segmentation</h4><p>Group the market by need/behaviour, then pick a beachhead segment to win first.</p></div>
    </div>
  `,
  quiz:[
    {q:"Which question best follows 'The Mom Test'?",opts:["'Would you buy a tool that does X?'","'Do you like my idea?'","'Walk me through the last time you dealt with this problem.'","'How much would you pay for this?'"],a:2,ex:"Ask about specific past behaviour, not hypotheticals or your idea."},
    {q:"SOM stands for:",opts:["Serviceable Obtainable Market","Sum Of Money","Standard Operating Metric","Segment Of Market"],a:0,ex:"SOM = the realistic share you can obtain, inside SAM, inside TAM."},
    {q:"Jobs To Be Done reframes a need as:",opts:["A list of features","The progress a customer is trying to make","The cheapest possible solution","A competitor's roadmap"],a:1,ex:"JTBD focuses on the progress/outcome the customer 'hires' a product for."},
    {q:"Porter's Five Forces assesses:",opts:["A team's velocity","How attractive and defensible a market is","A product's UI quality","Customer satisfaction"],a:1,ex:"Five Forces gauges industry attractiveness: rivalry, entrants, substitutes, buyer & supplier power."}
  ]
},
{
  id:"proposition", num:5, icon:"💡", title:"Propositions & Personas",
  tagline:"Why should I buy from you?",
  blurb:"Value propositions, personas, and articulating benefits customers actually care about.",
  html:`
    <p class="lead">A proposition answers the customer's blunt question: <b>"Why should I buy from you rather than the alternative — or do nothing?"</b> If you can't answer it in a sentence, neither can your customer.</p>

    <h3>Features vs Advantages vs Benefits (FAB)</h3>
    <table>
      <tr><th>Layer</th><th>Definition</th><th>Example (a drill)</th></tr>
      <tr><td><b>Feature</b></td><td>What it is / has</td><td>18V brushless motor</td></tr>
      <tr><td><b>Advantage</b></td><td>What that does</td><td>Drills faster, lasts longer</td></tr>
      <tr><td><b>Benefit</b></td><td>Why the customer cares</td><td>Finish the job in half the time</td></tr>
    </table>
    <div class="note"><span class="lbl">Rule</span>Customers buy benefits, not features. Always translate "we built X" into "so you can Y". A proposition made of features is a spec sheet, not a reason to buy.</div>

    <h3>Building a sharp value proposition</h3>
    <p>A useful template (Geoffrey Moore's positioning statement):</p>
    <blockquote><p>For <b>[target customer]</b> who <b>[need/opportunity]</b>, our <b>[product]</b> is a <b>[category]</b> that <b>[key benefit]</b>. Unlike <b>[alternative]</b>, we <b>[key differentiator]</b>.</p></blockquote>
    <p>The <b>Value Proposition Canvas</b> (Strategyzer) pairs the customer side — jobs, pains, gains — with your side — products, pain relievers, gain creators. A strong proposition is where those two halves genuinely match.</p>

    <h3>Personas — getting under the customer's skin</h3>
    <p>A persona is a believable, evidence-based archetype of a target user, so the whole team designs for a real human instead of "the user". A good persona has:</p>
    <ul>
      <li>Name, role and a photo (memorable, not a stereotype)</li>
      <li><b>Goals &amp; motivations</b> — what progress they want</li>
      <li><b>Pains &amp; frustrations</b> — what gets in the way</li>
      <li><b>Context</b> — environment, tech comfort, constraints</li>
      <li>A <b>defining quote</b> that captures their mindset</li>
    </ul>
    <div class="note dont"><span class="lbl">Don't</span>Invent personas from imagination. Base them on real interviews and data, or they'll just reinforce your own assumptions. And keep them few — 2 to 4 primary personas, not twelve.</div>
    <div class="note key"><span class="lbl">B2B nuance</span>In B2B you often manage several personas per deal: the <b>user</b>, the <b>economic buyer</b> (holds the budget), the <b>champion</b> (sells internally), and the <b>blocker</b>. Your proposition must speak to each.</div>
  `,
  quiz:[
    {q:"'Finish the job in half the time' is an example of a:",opts:["Feature","Advantage","Benefit","Specification"],a:2,ex:"Benefit = why the customer cares. Feature is 'what it has'; advantage is 'what it does'."},
    {q:"A value proposition primarily answers:",opts:["How much does it cost to build?","Why buy from you vs the alternative or nothing?","Which sprint will it ship in?","Who is the product owner?"],a:1,ex:"A proposition is the compelling reason to choose you over alternatives, including inaction."},
    {q:"A good persona should be:",opts:["Invented to match your idea","Based on real research and evidence","As numerous as possible","Only about demographics"],a:1,ex:"Personas must be grounded in real interviews/data, and kept to a few primary ones."},
    {q:"In B2B, the person who holds the budget is the:",opts:["Champion","User","Economic buyer","Blocker"],a:2,ex:"The economic buyer controls spend; the champion sells internally; the user uses it."}
  ]
},
{
  id:"strategy", num:6, icon:"♟️", title:"Product Strategy",
  tagline:"Vision, strategy, and saying no with a reason",
  blurb:"Vision vs strategy vs tactics, Playing to Win, Blue Ocean, OKRs and the North Star.",
  html:`
    <p class="lead">Without a strategy you're the ball in a pinball machine — bounced from request to request with no control. Strategy is the <b>reasoned choice of where to play and how to win</b>. It gives you the credibility to say no.</p>

    <h3>The hierarchy: Vision → Strategy → Roadmap → Tactics</h3>
    <table>
      <tr><th>Level</th><th>Answers</th><th>Horizon</th></tr>
      <tr><td><b>Mission / Vision</b></td><td>Why we exist &amp; the future we want to create</td><td>3–10 yrs</td></tr>
      <tr><td><b>Product strategy</b></td><td>Where we'll play, how we'll win, what we won't do</td><td>1–3 yrs</td></tr>
      <tr><td><b>Roadmap / OKRs</b></td><td>What outcomes we'll pursue next and in what order</td><td>Quarters</td></tr>
      <tr><td><b>Backlog / tactics</b></td><td>The specific work right now</td><td>Sprints</td></tr>
    </table>
    <div class="note key"><span class="lbl">Not a strategy</span>"Grow revenue 30%" is a goal, not a strategy. "Do more marketing" is a tactic. A strategy explains the <b>logic</b>: which customers, which problem, why we can win, and the hard trade-offs we accept.</div>

    <h3>Roger Martin — Playing to Win (5 questions)</h3>
    <ol>
      <li><b>What is our winning aspiration?</b> (the purpose)</li>
      <li><b>Where will we play?</b> (markets, segments, channels)</li>
      <li><b>How will we win?</b> (the differentiated way we beat rivals)</li>
      <li><b>What capabilities must be in place?</b></li>
      <li><b>What management systems are required?</b></li>
    </ol>

    <h3>Other strategy lenses</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Compete differently</span><h4>Blue Ocean</h4><p>Instead of bloody "red ocean" competition, create uncontested space. Use the <b>ERRC grid</b>: Eliminate, Reduce, Raise, Create factors the industry takes for granted.</p></div>
      <div class="card"><span class="tag">Focus</span><h4>Good Strategy / Bad Strategy</h4><p>Rumelt's kernel: a clear <b>diagnosis</b>, a <b>guiding policy</b>, and <b>coherent actions</b>. Bad strategy is fluff and goals with no logic.</p></div>
      <div class="card"><span class="tag">Portfolio</span><h4>BCG Matrix</h4><p>Stars, Cash Cows, Question Marks, Dogs — where to invest, milk, bet or exit across a product set.</p></div>
      <div class="card"><span class="tag">Direction</span><h4>Ansoff Matrix</h4><p>Grow via market penetration, market development, product development, or diversification.</p></div>
    </div>

    <h3>Turning strategy into goals: OKRs &amp; the North Star</h3>
    <p><b>OKRs</b> = one ambitious <em>Objective</em> + 2–4 measurable <em>Key Results</em>. Set outcomes ("increase weekly active teams to 10k"), not tasks ("ship feature X").</p>
    <p>The <b>North Star Metric</b> is the single measure that best captures the value customers get (e.g. Spotify: time spent listening; Airbnb: nights booked). It aligns the whole team without micromanaging.</p>
    <div class="note do"><span class="lbl">Do</span>Write a one-page strategy: the problem/opportunity, target customers, how you'll win, the few big bets, and — crucially — what you are explicitly <b>not</b> doing.</div>
  `,
  quiz:[

{
  id:"roadmap", num:7, icon:"🗺️", title:"Roadmaps",
  tagline:"Where the product is heading — and why",
  blurb:"Theme/outcome-based roadmaps, Now-Next-Later, and roadmaps vs release plans.",
  html:`
    <p class="lead">A roadmap is a <b>graphical, living view of where your product is heading</b>. It steers and coordinates teams across the business. Its danger: people read it as a dated promise. Your job is to communicate direction while protecting flexibility.</p>

    <h3>Three things people mean by "roadmap"</h3>
    <ul>
      <li><b>A plan for development</b> — what the team will work on.</li>
      <li><b>A commitment to customers</b> — dangerous if read as dates.</li>
      <li><b>A vision for management</b> — how the product will evolve.</li>
    </ul>
    <div class="note dont"><span class="lbl">Don't</span>Publish a roadmap as a Gantt chart of dated features. It becomes a stick to beat you with, kills flexibility, and pushes teams to ship on time rather than ship value.</div>

    <h3>Feature roadmap vs Outcome/Theme roadmap</h3>
    <table>
      <tr><th>Type</th><th>Organised by</th><th>Best for</th></tr>
      <tr><td><b>Feature timeline</b></td><td>Specific features on dates</td><td>Committed near-term work; risky as a promise</td></tr>
      <tr><td><b>Theme / outcome</b></td><td>Problems &amp; goals ("reduce churn")</td><td>Keeping teams focused on <em>why</em>, allowing <em>how</em> to flex</td></tr>
      <tr><td><b>Now / Next / Later</b></td><td>Confidence horizons, not dates</td><td>Honest communication of certainty</td></tr>
    </table>
    <div class="note key"><span class="lbl">Now / Next / Later</span>The most PM-friendly format. <b>Now</b> = committed, detailed. <b>Next</b> = likely, shaped. <b>Later</b> = directional bets. Certainty shrinks as you look further out — say so honestly.</div>

    <h3>Where roadmap ideas come from — and how to filter</h3>
    <ul>
      <li>Sources: customer requests, sales, support tickets, data/analytics, strategy, tech debt, competitors, your own vision.</li>
      <li>Filter every idea through the <b>strategy</b>: does it serve where we chose to play and how we chose to win?</li>
      <li>Balance the mix: keep-the-lights-on, customer-requested, and strategic bets.</li>
    </ul>

    <h3>Do roadmaps and Agile conflict?</h3>
    <p>No — if the roadmap is about <b>outcomes and direction</b>, not a fixed feature schedule. Agile decides <em>how</em> and <em>exactly when</em>; the roadmap sets <em>where</em> and <em>why</em>. Keep it a living document you revisit every quarter.</p>
    <div class="note do"><span class="lbl">Do</span>Add a visible disclaimer: "Direction, not dated commitment — subject to change as we learn." Tie each item to a strategic outcome so stakeholders see the reasoning.</div>
  `,
  quiz:[
    {q:"The most honest way to show decreasing certainty over time is:",opts:["A dated Gantt chart","Now / Next / Later horizons","A feature list with deadlines","A single launch date"],a:1,ex:"Now/Next/Later communicates confidence levels instead of false-precision dates."},
    {q:"A theme/outcome roadmap is organised by:",opts:["Individual features and dates","Problems and goals to achieve","Engineer names","Sprint numbers"],a:1,ex:"Outcome roadmaps focus on the 'why', letting the 'how' flex."},
    {q:"Roadmaps and Agile conflict when the roadmap is:",opts:["Focused on outcomes","A fixed schedule of dated features","Reviewed quarterly","Tied to strategy"],a:1,ex:"A dated feature promise fights Agile's adapt-as-you-learn nature; an outcome roadmap doesn't."},
    {q:"Every candidate roadmap item should first be filtered through:",opts:["The loudest stakeholder","The product strategy","Engineering capacity only","Alphabetical order"],a:1,ex:"Strategy is the filter: does this serve where we play and how we win?"}
  ]
},
{
  id:"requirements", num:8, icon:"📋", title:"Requirements",
  tagline:"Turning needs into buildable clarity",
  blurb:"MRD vs PRD, user stories, use cases, job stories, acceptance criteria and INVEST.",
  html:`
    <p class="lead">Requirements bridge the market and the build. Done well, they give engineering enough clarity to build the right thing without over-specifying <em>how</em>. The golden rule: <b>describe the problem and the desired outcome, not your pet solution.</b></p>

    <h3>MRD vs PRD (and who writes what)</h3>
    <table>
      <tr><th>Doc</th><th>Answers</th><th>Owner</th></tr>
      <tr><td><b>MRD</b> — Market Requirements</td><td>What does the <em>market</em> need &amp; why (problems, segments, size)</td><td>Product Manager</td></tr>
      <tr><td><b>PRD</b> — Product Requirements</td><td>What should the <em>product</em> do to meet that need</td><td>PM (with the team)</td></tr>
      <tr><td><b>Backlog</b> (stories)</td><td>The next buildable slices</td><td>PM / Product Owner</td></tr>
    </table>
    <p>Modern lean teams often collapse the MRD/PRD into a short <b>one-pager</b> or a set of well-written stories — but the <em>thinking</em> behind each still has to happen.</p>

    <h3>Four ways to write requirements</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Classic</span><h4>"The system shall…"</h4><p>Precise, testable statements. Good for regulated/complex systems; risks being solution-heavy and long.</p></div>
      <div class="card"><span class="tag">Agile</span><h4>User Story</h4><p>"As a [user], I want [goal], so that [benefit]." Keeps the user and the why front-and-centre.</p></div>
      <div class="card"><span class="tag">Flow</span><h4>Use Case</h4><p>Actor + goal + step-by-step interaction incl. alternate paths. Great for complex flows.</p></div>
      <div class="card"><span class="tag">JTBD</span><h4>Job Story</h4><p>"When [situation], I want to [motivation], so I can [outcome]." Focuses on context over persona.</p></div>
    </div>

    <h3>What makes a user story good — INVEST + DoR/DoD</h3>
    <p><b>INVEST:</b> Independent, Negotiable, Valuable, Estimable, Small, Testable.</p>
    <ul>
      <li><b>Acceptance criteria</b> define "done" for a story — often written as Given/When/Then (Gherkin).</li>
      <li><b>Definition of Ready (DoR)</b> — the story is clear enough to start.</li>
      <li><b>Definition of Done (DoD)</b> — the team's shared bar for "truly finished" (tested, documented, deployed).</li>
    </ul>
    <div class="note key"><span class="lbl">Don't forget non-functional requirements</span>Performance, security, accessibility, scalability, compliance, usability. They rarely appear as user stories but sink products when ignored. Also capture <b>process</b> and <b>UX</b> requirements.</div>

    <h3>The MVP mindset</h3>
    <p>A Minimum Viable Product is the <b>smallest thing that delivers real value and lets you learn</b> — not a broken half-product. Slice vertically (a thin end-to-end experience), not horizontally (a backend with no usable front).</p>
    <div class="note do"><span class="lbl">Do</span>For each requirement ask "how will we test this is met?" If you can't state the test, the requirement isn't clear yet.</div>
  `,
  quiz:[
    {q:"The user-story format is:",opts:["'The system shall process X'","'As a [user], I want [goal], so that [benefit]'","'When [situation], I want [motivation]'","'Given/When/Then'"],a:1,ex:"User story = role, goal, benefit. Job story uses 'When...'; Given/When/Then is acceptance criteria."},
    {q:"INVEST's 'T' stands for:",opts:["Timely","Testable","Trackable","Technical"],a:1,ex:"INVEST = Independent, Negotiable, Valuable, Estimable, Small, Testable."},
    {q:"An MVP should be:",opts:["A broken half-built product","The smallest thing that delivers value and enables learning","The full product minus marketing","A backend with no UI"],a:1,ex:"MVP = minimum + viable: a thin but real slice that lets you learn."},
    {q:"Performance, security and accessibility are examples of:",opts:["Vanity metrics","Non-functional requirements","User personas","Story points"],a:1,ex:"These are non-functional requirements — easy to forget, costly to ignore."}
  ]
},
{
  id:"prioritization", num:9, icon:"⚖️", title:"Prioritization",
  tagline:"Choosing what to build next — with a reason",
  blurb:"RICE, MoSCoW, Kano, Value vs Effort, WSJF and the opportunity cost mindset.",
  html:`
    <p class="lead">There are always more good ideas than capacity. Prioritisation is the daily craft of turning "everything is urgent" into a defensible order. Frameworks don't make the decision <em>for</em> you — they make your reasoning <b>explicit and debatable</b>.</p>

    <h3>The workhorses</h3>
    <table>
      <tr><th>Framework</th><th>How it scores</th><th>Best when</th></tr>
      <tr><td><b>Value vs Effort</b></td><td>2×2: high value / low effort wins</td><td>Fast, rough triage</td></tr>
      <tr><td><b>RICE</b></td><td>(Reach × Impact × Confidence) ÷ Effort</td><td>Comparing many features objectively</td></tr>
      <tr><td><b>MoSCoW</b></td><td>Must / Should / Could / Won't (this time)</td><td>Scoping a release with stakeholders</td></tr>
      <tr><td><b>Kano</b></td><td>Basic / Performance / Delighter needs</td><td>Balancing table-stakes vs wow</td></tr>
      <tr><td><b>WSJF</b></td><td>Cost of Delay ÷ job size (SAFe)</td><td>Sequencing by economic urgency</td></tr>
    </table>

    <h3>RICE, in detail</h3>
    <ul>
      <li><b>Reach</b> — how many users/events in a period (e.g. per quarter).</li>
      <li><b>Impact</b> — how much it moves the goal per user (e.g. 3 = massive, 1 = medium, 0.25 = minimal).</li>
      <li><b>Confidence</b> — how sure you are of your estimates (100% / 80% / 50%).</li>
      <li><b>Effort</b> — person-months of work.</li>
    </ul>
    <p><b>RICE score = (Reach × Impact × Confidence) ÷ Effort.</b> Higher = do sooner. Try the interactive calculator in <b>Tools → RICE Calculator</b>.</p>

    <h3>Kano model — not all value is equal</h3>
    <div class="grid g3">
      <div class="card"><span class="tag">Must-be</span><h4>Basic needs</h4><p>Expected. Absence angers; presence is unnoticed. (A hotel room must be clean.)</p></div>
      <div class="card"><span class="tag">Performance</span><h4>Linear needs</h4><p>More is better and customers will pay for it. (Faster load, longer battery.)</p></div>
      <div class="card"><span class="tag">Delighters</span><h4>Excitement needs</h4><p>Unexpected wow that differentiates — until rivals copy it and it becomes basic.</p></div>
    </div>

    <div class="note key"><span class="lbl">The real mental model: opportunity cost</span>Every "yes" is a "no" to everything else that hour could build. The best PMs prioritise against the <b>strategy and the goal</b>, not the loudest voice. A framework's job is to expose assumptions, not to hide behind a number.</div>
    <div class="note dont"><span class="lbl">Don't</span>Treat RICE scores as truth. Garbage estimates give confident-looking garbage rankings. Use them to structure debate, then apply judgement.</div>
  `,
  quiz:[
    {q:"The RICE formula is:",opts:["Reach + Impact + Confidence − Effort","(Reach × Impact × Confidence) ÷ Effort","Reach ÷ (Impact × Effort)","Impact × Effort × Confidence"],a:1,ex:"RICE = (Reach × Impact × Confidence) ÷ Effort. Higher is better."},
    {q:"In MoSCoW, 'W' means:",opts:["Will do first","Won't do (this time)","Wish list forever","Weekly"],a:1,ex:"Won't-have-this-time — explicitly de-scoped for now, which is a real decision."},
    {q:"A surprise feature that delights customers but they'd never ask for is a Kano:",opts:["Basic need","Performance need","Delighter (excitement need)","Reverse need"],a:2,ex:"Delighters create wow; over time rivals copy them and they become basic expectations."},
    {q:"The deepest reason prioritisation matters is:",opts:["It fills the sprint","Opportunity cost — every yes is a no to something else","It pleases stakeholders","It's required by Scrum"],a:1,ex:"Capacity is finite; choosing one thing means not doing others. That's the core trade-off."}
  ]
},
{
  id:"agile", num:10, icon:"🏃", title:"Agile & Scrum",
  tagline:"How modern product teams build",
  blurb:"Agile values, Scrum roles/events/artifacts, Kanban, and how PM fits with Agile.",
  html:`
    <p class="lead">Agile is a <b>mindset</b>, not a process: deliver value in small increments, get feedback fast, and adapt. Scrum and Kanban are two popular ways to <em>do</em> Agile. As a PM you set the <b>what &amp; why</b>; the team owns the <b>how</b>.</p>

    <h3>The Agile Manifesto — 4 values</h3>
    <ul>
      <li><b>Individuals &amp; interactions</b> over processes and tools</li>
      <li><b>Working software</b> over comprehensive documentation</li>
      <li><b>Customer collaboration</b> over contract negotiation</li>
      <li><b>Responding to change</b> over following a plan</li>
    </ul>
    <p>"…while there is value in the items on the right, we value the items on the left more." Backed by 12 principles (deliver frequently, welcome change, sustainable pace, reflect &amp; adjust).</p>

    <h3>Scrum in one table</h3>
    <table>
      <tr><th>Category</th><th>Elements</th></tr>
      <tr><td><b>Roles</b></td><td>Product Owner (value &amp; backlog), Scrum Master (process &amp; unblocking), Developers (build it)</td></tr>
      <tr><td><b>Events</b></td><td>Sprint (1–4 wks), Sprint Planning, Daily Scrum (standup), Sprint Review (demo), Retrospective</td></tr>
      <tr><td><b>Artifacts</b></td><td>Product Backlog, Sprint Backlog, Increment (potentially shippable)</td></tr>
    </table>
    <div class="note"><span class="lbl">Key distinction</span>The <b>Product Backlog</b> is the ordered list of everything that might be built (PM/PO owns it). The <b>Sprint Backlog</b> is what the team committed to for this sprint (the team owns it).</div>

    <h3>Scrum vs Kanban</h3>
    <table>
      <tr><th></th><th>Scrum</th><th>Kanban</th></tr>
      <tr><td>Cadence</td><td>Fixed-length sprints</td><td>Continuous flow</td></tr>
      <tr><td>Core idea</td><td>Commit to a sprint goal</td><td>Limit work-in-progress (WIP)</td></tr>
      <tr><td>Change mid-cycle</td><td>Avoided during a sprint</td><td>Anytime</td></tr>
      <tr><td>Best for</td><td>Feature delivery in cycles</td><td>Support / ops / steady flow</td></tr>
    </table>

    <h3>Estimation &amp; flow terms</h3>
    <ul>
      <li><b>Story points</b> — relative size (effort/complexity/uncertainty), not hours. Often Fibonacci (1,2,3,5,8).</li>
      <li><b>Velocity</b> — points completed per sprint; a planning aid, <em>not</em> a productivity target to game.</li>
      <li><b>Burndown / burnup</b> — remaining/completed work over time.</li>
      <li><b>Cycle time / lead time</b> — how long work takes to flow through (Kanban health).</li>
    </ul>

    <div class="note key"><span class="lbl">"What's the point of PM in Agile?"</span>Scrum has a Product Owner but no strategy, market analysis, pricing or GTM. Someone must still decide <em>what problems are worth solving and why</em>. That's product leadership — the PM. Agile makes the PM more important, not less.</div>
    <div class="note dont"><span class="lbl">Don't</span>Let "Agile" become an excuse for no plan or no discovery. Doing sprints ≠ being agile. And velocity is a capacity signal, not a KPI — pressuring it just inflates estimates.</div>
  `,
  quiz:[
    {q:"Who owns and orders the Product Backlog?",opts:["The Scrum Master","The Product Owner","The whole company","QA"],a:1,ex:"The PO/PM owns backlog value & order; the team owns the Sprint Backlog."},
    {q:"Story points estimate:",opts:["Exact hours","Relative size/effort/complexity","Dollar cost","Number of bugs"],a:1,ex:"Points are a relative measure, deliberately not hours."},
    {q:"The core mechanic of Kanban is:",opts:["Fixed sprints","Limiting work-in-progress and continuous flow","Story-point poker","Quarterly releases"],a:1,ex:"Kanban = visualise flow + WIP limits + continuous delivery."},
    {q:"'Responding to change over following a plan' is:",opts:["A Scrum event","An Agile Manifesto value","A Kanban metric","A prioritisation method"],a:1,ex:"It's one of the four Agile Manifesto values."},
    {q:"Velocity is best used as:",opts:["A productivity KPI to maximise","A planning aid for capacity","A bonus metric","A customer-facing number"],a:1,ex:"Velocity helps forecast; turning it into a target just inflates estimates."}
  ]
},
{
  id:"metrics", num:11, icon:"📊", title:"Metrics & Analytics",
  tagline:"Measuring what matters",
  blurb:"North Star, AARRR pirate metrics, HEART, funnels, cohorts, leading vs lagging, guardrails.",
  html:`
    <p class="lead">"If you can't measure it, you can't improve it." Metrics turn opinions into decisions. The skill isn't drowning in dashboards — it's picking the <b>few numbers that reflect real value</b> and knowing what action each would trigger.</p>

    <h3>AARRR — the "pirate metrics" funnel</h3>
    <table>
      <tr><th>Stage</th><th>Question</th><th>Example metric</th></tr>
      <tr><td><b>Acquisition</b></td><td>How do they find us?</td><td>Signups, traffic, CAC</td></tr>
      <tr><td><b>Activation</b></td><td>Do they reach first value fast?</td><td>% reaching the "aha" moment</td></tr>
      <tr><td><b>Retention</b></td><td>Do they come back?</td><td>DAU/MAU, churn, cohort curves</td></tr>
      <tr><td><b>Revenue</b></td><td>Do they pay?</td><td>MRR/ARR, ARPU, LTV</td></tr>
      <tr><td><b>Referral</b></td><td>Do they tell others?</td><td>NPS, viral coefficient (K)</td></tr>
    </table>

    <h3>Google's HEART (for UX quality)</h3>
    <p><b>H</b>appiness, <b>E</b>ngagement, <b>A</b>doption, <b>R</b>etention, <b>T</b>ask success — each paired with Goals-Signals-Metrics to make it measurable.</p>

    <h3>Vocabulary that trips people up</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Direction</span><h4>Leading vs Lagging</h4><p><b>Leading</b> predicts the future (trial signups). <b>Lagging</b> confirms the past (quarterly revenue). Steer with leading, report with lagging.</p></div>
      <div class="card"><span class="tag">Trap</span><h4>Vanity vs Actionable</h4><p>Vanity metrics (total signups ever) feel good but don't guide decisions. Actionable metrics tie to a change you can make.</p></div>
      <div class="card"><span class="tag">Slice</span><h4>Cohorts</h4><p>Group users by when they joined and track behaviour over time — the honest way to see if retention is improving.</p></div>
      <div class="card"><span class="tag">Safety</span><h4>Guardrail metrics</h4><p>Numbers that must NOT get worse while you chase a goal (e.g. don't grow signups by wrecking load time or support tickets).</p></div>
    </div>

    <h3>Money metrics every PM should know</h3>
    <ul>
      <li><b>CAC</b> — Customer Acquisition Cost. <b>LTV</b> — Lifetime Value. Healthy SaaS aims for <b>LTV:CAC ≥ 3</b>.</li>
      <li><b>MRR / ARR</b> — Monthly/Annual Recurring Revenue. <b>ARPU</b> — Average Revenue Per User.</li>
      <li><b>Churn</b> — % of customers (or revenue) lost per period. <b>NRR</b> — Net Revenue Retention (>100% = growing from existing customers).</li>
      <li><b>Payback period</b> — months to recover CAC.</li>
    </ul>

    <h3>Testing changes: A/B testing</h3>
    <p>Split traffic, change one variable, measure the difference, check <b>statistical significance</b> before believing it. Beware peeking early and tiny sample sizes.</p>
    <div class="note do"><span class="lbl">Do</span>For every metric, define the <b>decision it drives</b>: "if activation < 50% we simplify onboarding." A metric with no attached action is just decoration.</div>
    <div class="note dont"><span class="lbl">Don't</span>Optimise one metric blind to guardrails — you can boost signups and quietly destroy retention. Watch the system, not a single number (Goodhart's Law).</div>
  `,
  quiz:[
    {q:"In AARRR, 'reaching the aha moment quickly' is:",opts:["Acquisition","Activation","Referral","Revenue"],a:1,ex:"Activation = the user reaching first value quickly after arriving."},
    {q:"A leading metric is one that:",opts:["Confirms past results","Predicts likely future results","Is always financial","Can't be influenced"],a:1,ex:"Leading metrics (e.g. trials started) predict; lagging metrics (e.g. revenue) confirm."},
    {q:"A healthy SaaS ratio is often stated as:",opts:["CAC:LTV ≥ 3","LTV:CAC ≥ 3","Churn ≥ 3%","NPS ≥ 3"],a:1,ex:"You want lifetime value at least ~3× the cost to acquire the customer."},
    {q:"A guardrail metric is one that:",opts:["You try to maximise","Must not get worse while you chase a goal","Only finance tracks","Measures vanity"],a:1,ex:"Guardrails protect the system (e.g. latency, support load) from being sacrificed."},
    {q:"'Total signups since launch' is usually a:",opts:["Actionable metric","Guardrail","Vanity metric","Cohort"],a:2,ex:"A big cumulative number feels good but rarely guides a decision — that's vanity."}
  ]
},
{
  id:"pricing", num:12, icon:"💰", title:"Pricing",
  tagline:"Setting the optimum price",
  blurb:"Cost/competition/value pricing, price psychology, structures and SaaS models.",
  html:`
    <p class="lead">Pricing is the fastest lever on profit — a small price change beats most cost-cutting — yet PMs often leave it to sales or finance. Take control: price reflects <b>value to the customer</b>, not just your costs.</p>

    <h3>Three ways to set price</h3>
    <table>
      <tr><th>Approach</th><th>Based on</th><th>Risk</th></tr>
      <tr><td><b>Cost-plus</b></td><td>Your cost + a margin</td><td>Ignores what customers will actually pay; leaves money on the table</td></tr>
      <tr><td><b>Competitor-based</b></td><td>What rivals charge</td><td>Races to the bottom; assumes rivals are right</td></tr>
      <tr><td><b>Value-based</b></td><td>The worth to the customer</td><td>Hardest to quantify — and the most profitable when done well</td></tr>
    </table>
    <div class="note key"><span class="lbl">The goal</span>Capture a fair share of the value you create. If your product saves a customer £10k, cost-plus pricing at £500 is a gift to them and a loss to you.</div>

    <h3>The psychology of pricing</h3>
    <ul>
      <li><b>Anchoring</b> — the first price seen frames everything after (a £199 tier makes £99 feel cheap).</li>
      <li><b>Charm pricing</b> — £9.99 reads as "9-something", not 10.</li>
      <li><b>Decoy effect</b> — a deliberately poor middle option pushes people to the premium.</li>
      <li><b>Price = quality signal</b> — too cheap can undermine perceived value.</li>
      <li><b>Loss aversion &amp; framing</b> — "save £X" vs "spend £X" land differently.</li>
    </ul>

    <h3>Pricing structures &amp; SaaS models</h3>
    <div class="grid g2">
      <div class="card"><span class="tag">Structure</span><h4>Good-Better-Best (tiering)</h4><p>3 tiers anchor value and let customers self-select. The middle usually wins.</p></div>
      <div class="card"><span class="tag">Structure</span><h4>Per-seat / per-user</h4><p>Simple, predictable; can penalise wide adoption.</p></div>
      <div class="card"><span class="tag">Structure</span><h4>Usage / consumption</h4><p>Pay for what you use; scales with value but is less predictable.</p></div>
      <div class="card"><span class="tag">Model</span><h4>Freemium &amp; free trial</h4><p>Free tier/trial drives acquisition; the art is the upgrade trigger.</p></div>
    </div>
    <p>Key concept: the <b>value metric</b> — the unit you charge by (per seat, per GB, per API call). Pick one that grows as the customer gets more value.</p>

    <div class="note do"><span class="lbl">Do</span>Test willingness to pay directly. The <b>Van Westendorp</b> survey ("At what price is this too expensive? too cheap? getting expensive? a bargain?") reveals an acceptable price range.</div>
    <div class="note dont"><span class="lbl">Don't</span>Compete only on price. It's easy to match and starts a war you may lose. Differentiate on value, then price to it.</div>
  `,

    {q:"The most profitable (and hardest) pricing approach is:",opts:["Cost-plus","Competitor-based","Value-based","Random"],a:2,ex:"Value-based pricing captures the worth delivered to the customer — hardest to quantify, best returns."},

{
  id:"business-case", num:13, icon:"📈", title:"Business Cases & Finance",
  tagline:"Making the numbers stack up",
  blurb:"Building a business case, ROI/NPV/payback, sensitivity analysis and finance jargon.",
  html:`
    <p class="lead">A business case is the argument — in numbers and narrative — that an investment is worth making. PMs who speak finance get their products funded. You don't need an MBA; you need a handful of concepts and honesty about assumptions.</p>

    <h3>What a good business case contains</h3>
    <ol>
      <li><b>The problem/opportunity</b> and strategic fit</li>
      <li><b>Options considered</b> (including "do nothing")</li>
      <li><b>Costs</b> — build, run, sell, support (one-off + ongoing)</li>
      <li><b>Benefits</b> — revenue, savings, risk reduction (quantified where possible)</li>
      <li><b>Financials</b> — ROI, payback, NPV over a time horizon</li>
      <li><b>Risks &amp; assumptions</b>, and how you'll de-risk</li>
      <li><b>Recommendation</b></li>
    </ol>

    <h3>Finance jargon, decoded</h3>
    <table>
      <tr><th>Term</th><th>Plain meaning</th></tr>
      <tr><td><b>ROI</b></td><td>Return on Investment = (gain − cost) ÷ cost, as a %</td></tr>
      <tr><td><b>Payback period</b></td><td>How long until the investment pays for itself</td></tr>
      <tr><td><b>NPV</b></td><td>Net Present Value — future cash flows discounted to today's money. Positive = value-creating</td></tr>
      <tr><td><b>IRR</b></td><td>Internal Rate of Return — the discount rate where NPV = 0; compare to your hurdle rate</td></tr>
      <tr><td><b>Discount rate</b></td><td>Rate used to shrink future money to today (money later is worth less than money now)</td></tr>
      <tr><td><b>CapEx vs OpEx</b></td><td>Capital (one-off assets) vs Operating (ongoing running costs)</td></tr>
      <tr><td><b>Gross margin</b></td><td>Revenue − cost of goods sold, as a % — how much each sale actually contributes</td></tr>
      <tr><td><b>Break-even</b></td><td>The volume/point where revenue equals total cost</td></tr>
    </table>

    <h3>Scenario &amp; sensitivity analysis</h3>
    <p>Never present a single number as fact. Show <b>best / base / worst</b> case, and run <b>sensitivity analysis</b> — which assumption, if wrong, breaks the case? That's where your attention (and de-risking) should go.</p>

    <div class="note dont"><span class="lbl">Don't — 7 classic mistakes</span>Over-optimistic adoption, ignoring ongoing costs, cherry-picking assumptions, no "do nothing" baseline, false precision, hiding risks, and reverse-engineering the numbers to a predetermined answer. Reviewers can smell all seven.</div>
    <div class="note do"><span class="lbl">Do</span>Make assumptions explicit and easy to challenge. A business case people trust beats an optimistic one they don't. Tie benefits to a metric you'll actually track post-launch.</div>
  `,
  quiz:[
    {q:"NPV being positive means the investment:",opts:["Is cheap to build","Creates value once future cash is discounted to today","Has no risk","Pays back instantly"],a:1,ex:"Positive NPV = discounted future cash flows exceed the cost. Money later is worth less than now."},
    {q:"Payback period measures:",opts:["Total lifetime profit","How long until the investment recoups its cost","The discount rate","Gross margin"],a:1,ex:"It's the time to recover the initial outlay."},
    {q:"Sensitivity analysis tells you:",opts:["The exact future","Which assumption most affects the outcome if wrong","The competitor's price","The sprint length"],a:1,ex:"It reveals the assumptions your case is most fragile to — where to focus de-risking."},
    {q:"A credible business case always includes:",opts:["Only the best case","A 'do nothing' baseline and explicit assumptions","A guaranteed ROI","No risks"],a:1,ex:"Compare against doing nothing and expose assumptions so reviewers can trust the case."}
  ]
},
{
  id:"gtm", num:14, icon:"🚀", title:"Go-to-Market & Launch",
  tagline:"Hit the ground running",
  blurb:"GTM strategy, launch checklist, beta vs GA, early adopters and outcome-focused launches.",
  html:`
    <p class="lead">Building it is half the job; getting it adopted is the other half. A launch is a <b>cross-functional event</b> you orchestrate — sales, marketing, support, ops and legal all have to be ready on the same day. The measure of success is adoption and value, not just "we shipped on the date".</p>

    <h3>A Go-to-Market strategy answers</h3>
    <ul>
      <li><b>Who</b> is the target segment &amp; persona?</li>
      <li><b>What</b> is the proposition &amp; positioning (the messaging)?</li>
      <li><b>How</b> will we reach them — channels (sales-led, product-led, partners, marketing)?</li>
      <li><b>How much</b> — pricing &amp; packaging?</li>
      <li><b>How</b> do we support &amp; onboard them?</li>
    </ul>
    <div class="note key"><span class="lbl">Motion matters</span><b>Sales-led</b> (reps close deals — high ACV, complex B2B) vs <b>Product-led growth (PLG)</b> (the product sells itself via free/trial and self-serve). Your GTM motion shapes the whole plan.</div>

    <h3>Launch tiers &amp; phasing</h3>
    <table>
      <tr><th>Phase</th><th>Purpose</th></tr>
      <tr><td><b>Alpha</b></td><td>Internal / friendly testing — find the big breakages</td></tr>
      <tr><td><b>Beta</b></td><td>Limited real users — validate value &amp; iron out issues</td></tr>
      <tr><td><b>GA (General Availability)</b></td><td>Open to all — the full launch</td></tr>
      <tr><td><b>Soft vs Hard launch</b></td><td>Quiet gradual rollout vs big-bang announcement</td></tr>
    </table>
    <p>Not every launch is Tier-1. Size the noise to the news: a big platform release warrants a full campaign; a minor feature may just need release notes.</p>

    <h3>Early adopters &amp; the launch checklist</h3>
    <p>Recruit <b>early adopters</b> — they tolerate rough edges, give rich feedback, and become references. Then work a <b>cross-functional launch checklist</b>: product ready, docs &amp; training, sales enablement, pricing in systems, support briefed, marketing assets, legal/compliance, analytics instrumented, rollback plan.</p>
    <div class="note"><span class="lbl">Stakeholder tool</span>Use a simple RACI/stakeholder map so everyone knows who's Responsible, Accountable, Consulted and Informed for each launch task. Silence is not readiness.</div>

    <div class="note do"><span class="lbl">Do — outcome, not output</span>Define launch success up front as adoption/activation targets, not "we hit the date". Instrument before launch so you can see whether customers actually get value.</div>
    <div class="note dont"><span class="lbl">Don't</span>Launch to everyone before you can support them, or pick a date that clashes with a holiday, a major event, or a competitor's headline moment. Timing is a decision, not an accident.</div>
  `,

    {q:"'GA' in a launch means:",opts:["Good Availability","General Availability — open to all","Gradual Alpha","Guaranteed Adoption"],a:1,ex:"GA = the full public release after alpha/beta."},
    {q:"Product-led growth (PLG) means:",opts:["Sales reps close every deal","The product itself drives acquisition via free/trial self-serve","Marketing owns the roadmap","Only enterprise sales"],a:1,ex:"PLG lets the product sell itself; sales-led relies on reps for higher-value deals."},
    {q:"Early adopters are valuable because they:",opts:["Pay the most","Tolerate rough edges and give rich feedback","Never complain","Require no support"],a:1,ex:"They accept imperfection, provide feedback, and become references."},
    {q:"The best definition of launch success is:",opts:["We shipped on the planned date","Customer adoption and value against pre-set targets","Number of press releases","Lines of code shipped"],a:1,ex:"Outcome over output — measure adoption/activation, not just hitting the date."}
