{
  id:"marketing", num:15, icon:"📣", title:"Product Marketing",
  tagline:"Getting products in front of customers",
  blurb:"Positioning, messaging, the 4 Ps, inbound/content and PMM vs PM.",
  html:`
    <p class="lead">Product marketing (PMM) is the bridge between the product and the market: <b>the right message, to the right people, in the right place, at the right time.</b> PM decides what to build; PMM makes sure the world knows why it matters and buys it.</p>

    <h3>PM vs PMM</h3>
    <table>
      <tr><th></th><th>Product Manager</th><th>Product Marketing Manager</th></tr>
      <tr><td>Focus</td><td>Build the right product</td><td>Take it to market &amp; sell it</td></tr>
      <tr><td>Owns</td><td>Roadmap, requirements, value</td><td>Positioning, messaging, launch, enablement</td></tr>
      <tr><td>Question</td><td>What &amp; why do we build?</td><td>How do we win the buyer's mind?</td></tr>
    </table>
    <p>In smaller companies the PM does both. They overlap heavily on personas, proposition and launch.</p>

    <h3>Positioning &amp; messaging</h3>
    <p><b>Positioning</b> = the place your product occupies in the customer's mind vs alternatives. <b>Messaging</b> = the words that convey it. Good messaging leads with the <b>customer's problem and benefit</b>, not your feature list, and is consistent everywhere.</p>
    <blockquote><p>For [target] who [need], [product] is the [category] that [benefit], because [reason to believe]. Unlike [alternative], [differentiator].</p></blockquote>

    <h3>The marketing mix — 4 Ps (→ 7 Ps)</h3>
    <ul>
      <li><b>Product</b> — what it is &amp; the value it gives</li>
      <li><b>Price</b> — pricing &amp; packaging</li>
      <li><b>Place</b> — channels &amp; distribution</li>
      <li><b>Promotion</b> — how you communicate &amp; generate demand</li>
      <li>Services add: <b>People, Process, Physical evidence</b></li>
    </ul>

    <h3>Inbound &amp; content marketing</h3>
    <p><b>Outbound</b> pushes the message out (ads, cold outreach). <b>Inbound</b> pulls people in by being useful — SEO, content, webinars — earning attention and generating <b>MQLs</b> (marketing-qualified leads) that convert to <b>SQLs</b> (sales-qualified leads) down the funnel.</p>

    <div class="note key"><span class="lbl">Sales enablement</span>A huge, under-appreciated PMM job: arm the sales team with battlecards, demos, objection handling, ROI stories and competitive positioning. A great product with a confused sales team doesn't sell.</div>
    <div class="note do"><span class="lbl">Do</span>Own your product's story. If you can't explain in one sentence who it's for and why it's better, your customers and your own sales team certainly can't.</div>
  `,

    {q:"'Positioning' is best defined as:",opts:["The price of the product","The place your product holds in the customer's mind vs alternatives","The launch date","The number of features"],a:1,ex:"Positioning is the mental space you occupy relative to competitors."},

{
  id:"leading", num:16, icon:"🤝", title:"Leading & Stakeholders",
  tagline:"Influence without authority",
  blurb:"Stakeholder management, RACI, communication, saying no, and leading the team.",
  html:`
    <p class="lead">A PM has huge responsibility and almost no direct authority. Your entire job runs on <b>influence</b>: aligning engineers, designers, sales, marketing, support, finance and execs around a shared direction — none of whom report to you.</p>

    <h3>Map your stakeholders</h3>
    <p>Use a <b>Power/Interest grid</b> to decide how much attention each stakeholder needs:</p>
    <table>
      <tr><th>Power ↓ / Interest →</th><th>Low interest</th><th>High interest</th></tr>
      <tr><td><b>High power</b></td><td>Keep satisfied</td><td>Manage closely (key players)</td></tr>
      <tr><td><b>Low power</b></td><td>Monitor</td><td>Keep informed</td></tr>
    </table>
    <p>Pair with <b>RACI</b> for any initiative — who is <b>R</b>esponsible (does it), <b>A</b>ccountable (owns the outcome, one person), <b>C</b>onsulted (input), <b>I</b>nformed (kept in the loop).</p>

    <h3>Communicate to align</h3>
    <ul>
      <li>Tailor the message: execs want outcomes &amp; trade-offs; engineers want clarity &amp; the why; sales want what's coming &amp; when.</li>
      <li>Write crisp <b>one-pagers</b> — a single clear artifact that gets ten people rowing together beats a dozen meetings.</li>
      <li>Over-communicate the <b>why</b>. People execute better and forgive change when they understand the reasoning.</li>
    </ul>

    <h3>The art of saying no</h3>
    <div class="note key"><span class="lbl">Say no to the request, not the person</span>Acknowledge the underlying need, explain the trade-off ("yes, and here's what we'd drop"), tie the decision to the strategy, and leave the door open. A reasoned no builds more trust than an over-promised yes.</div>

    <h3>Leading the team</h3>
    <ul>
      <li><b>Servant leadership</b> — remove blockers, provide context, then get out of the way.</li>
      <li>Give the team the <b>problem and the why</b>, not just a spec — you'll get better solutions and more ownership.</li>
      <li>Build <b>trust</b> with engineering &amp; design by respecting their craft and involving them early in discovery.</li>
      <li>Manage up: keep leadership informed with no surprises; bring problems <em>with</em> a recommendation.</li>
    </ul>

    <h3>Handling conflict &amp; disagreement</h3>
    <p>Use <b>"disagree and commit"</b> — argue hard on the evidence, then once a call is made, everyone rows together. Escalate cleanly when truly stuck, framing the decision and the options rather than the drama.</p>
    <div class="note do"><span class="lbl">Do</span>Make decisions transparent: capture the decision, the why, and who was consulted. Trust compounds when people can see how and why calls are made.</div>
    <div class="note dont"><span class="lbl">Don't</span>Try to please everyone — you'll build an incoherent product. And don't rely on your (non-existent) authority; you lead by clarity, evidence and relationships.</div>
  `,
  quiz:[

const INTERVIEW = [
{cat:"Product Design",q:"Design a product for X (e.g. an alarm clock for the blind).",approach:`<p><b>Structure it, don't jump to features.</b> Interviewers test your thinking process, not your idea.</p>
  <h5>A reliable framework (CIRCLES-lite)</h5>
  <ol><li><b>Clarify</b> — ask about goal, platform, constraints. "Who is this for and what's the business goal?"</li>
  <li><b>Who</b> — pick 1–2 user segments/personas.</li>
  <li><b>Needs / pain points</b> — list their jobs-to-be-done; pick the most important.</li>
  <li><b>Solutions</b> — brainstorm 3+, then narrow.</li>
  <li><b>Prioritise</b> — use value vs effort or impact; state your reasoning.</li>
  <li><b>Measure</b> — how would you know it worked? (a success metric)</li>
  <li><b>Summarise</b> the recommendation and trade-offs.</li></ol>`,
  points:["Always clarify before solving","Anchor on a specific user + their top need","Voice the trade-offs out loud","End with a success metric"]},

{cat:"Analytical / Metrics",q:"A key metric dropped 20% overnight. What do you do?",approach:`<p><b>Be a calm detective. Structure the diagnosis.</b></p>
  <h5>Steps</h5>
  <ol><li><b>Clarify the metric</b> — exact definition, timeframe, which metric.</li>
  <li><b>Is it real?</b> — rule out a tracking/logging bug or a data pipeline break first (most 'overnight' drops are instrumentation).</li>
  <li><b>Segment</b> — slice by platform, geography, new vs returning, browser, app version, marketing channel. Where is the drop concentrated?</li>
  <li><b>Internal vs external</b> — did we ship a release? Change pricing? Or was it a holiday, outage, competitor, seasonality, PR event?</li>
  <li><b>Form a hypothesis</b>, verify with data, then decide the fix and how to prevent recurrence.</li></ol>`,
  points:["Check for a tracking bug FIRST","Segment to localise the drop","Separate internal changes from external events","State a hypothesis, then verify"]},

{cat:"Behavioral",q:"Tell me about a time you influenced without authority.",approach:`<p><b>Use STAR:</b> Situation, Task, Action, Result. Keep it specific and quantified.</p>
  <ul><li><b>Situation</b> — set the context briefly.</li>
  <li><b>Task</b> — what you were responsible for.</li>
  <li><b>Action</b> — what <em>you</em> did (use 'I', not 'we'): the data you gathered, how you aligned stakeholders, the trade-offs you framed.</li>
  <li><b>Result</b> — the measurable outcome, and what you learned.</li></ul>
  <p>For influence specifically, show you led with <b>evidence and shared goals</b>, not politics.</p>`,
  points:["Use STAR and say 'I' not 'we'","Quantify the result","Show evidence-based persuasion","End with a reflection/learning"]},

{cat:"Strategy",q:"Should Company X build/enter market Y?",approach:`<p><b>A structured go/no-go, not a gut answer.</b></p>
  <ol><li><b>Clarify the goal</b> — why are they considering it? (growth, defence, new segment)</li>
  <li><b>Market</b> — size (TAM/SAM/SOM), growth, trends (PESTLE).</li>
  <li><b>Fit</b> — does it match the company's strategy, strengths and brand? ('Where to play / how to win'.)</li>
  <li><b>Competition</b> — who's there, how defensible (Five Forces)? What's our differentiation?</li>
  <li><b>Feasibility & cost</b> vs the opportunity; risks.</li>
  <li><b>Recommendation</b> — a clear yes/no with the top 2 reasons and how you'd de-risk (e.g. an experiment first).</li></ol>`,
  points:["Anchor on the strategic goal","Assess market, fit, competition, feasibility","Give a clear recommendation","Propose a way to de-risk before full commitment"]},

{cat:"Estimation",q:"How many X are there / sold per year? (market sizing)",approach:`<p><b>They want structured reasoning, not the exact number.</b></p>
  <ol><li><b>State assumptions out loud</b> — population, penetration, frequency.</li>
  <li><b>Pick top-down or bottom-up</b> and build with round numbers.</li>
  <li>Example: coffees/day in a city = population × % who drink coffee × cups/day.</li>
  <li><b>Sanity-check</b> the result against something you know.</li>
  <li>Note what would most change the answer.</li></ol>`,
  points:["Think aloud; show the structure","Use round, defensible numbers","Sanity-check the final figure","It's about the method, not the answer"]},

{cat:"Prioritization",q:"You have 5 features and one quarter. How do you decide?",approach:`<p><b>Show a repeatable method tied to strategy.</b></p>
  <ol><li><b>Clarify the goal/metric</b> this quarter is meant to move.</li>
  <li>Score each feature with <b>RICE</b> (or value vs effort) — say your Reach/Impact/Confidence/Effort estimates.</li>
  <li>Sanity-check against <b>strategy</b> and dependencies (some things unblock others).</li>
  <li>Balance the mix: strategic bets, customer requests, keep-the-lights-on.</li>
  <li>Communicate the <b>reasoning and what you're saying no to</b>, and why.</li></ol>`,
  points:["Tie priority to the goal metric","Make estimates explicit (RICE)","Consider dependencies & mix","Explain the no, not just the yes"]},

{cat:"Product Design",q:"What's your favourite product and how would you improve it?",approach:`<p><b>Tests product sense + structured critique.</b></p>

{cat:"Behavioral",q:"Tell me about a product/feature that failed. What happened?",approach:`<p><b>They're testing ownership and learning, not perfection.</b></p>

  <li>End with the <b>concrete lesson</b> and how you applied it later.</li></ul>`,
  points:["Be honest; take ownership","Show how you measured the failure","Focus on the learning applied since","Avoid blaming the team"]},

{cat:"Analytical / Metrics",q:"How would you measure the success of feature Z?",approach:`<p><b>Connect the feature to value, then pick metrics.</b></p>

{cat:"Strategy",q:"What would you do in your first 30/60/90 days as PM here?",approach:`<p><b>Show a learn-then-lead plan.</b></p>

/* ---------- state / persistence ---------- */
const LS_KEY = "pmStudioProgress_v1";
let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {done:{},scores:{}}; }catch(e){ return {done:{},scores:{}}; } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- toast ---------- */
let toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),2200); }

/* ---------- progress ---------- */
function completedCount(){ return MODULES.filter(m=>state.done[m.id]).length; }
function updateProgress(){
  const pct = Math.round(completedCount()/MODULES.length*100);
  progFill.style.width=pct+"%"; progPct.textContent=pct+"%";
  progLabel.textContent = completedCount()+" of "+MODULES.length+" modules complete";
}
function markDone(id){ if(!state.done[id]){ state.done[id]=true; save(); buildNav(); updateProgress(); toast("Module complete ✓ "+pct()+"% overall"); } }
function pct(){ return Math.round(completedCount()/MODULES.length*100); }

function setActiveNav(route){
  nav.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.route===route));
}

/* ---------- router ---------- */
function navigate(route){
  route = route||"home";
  const m = MODULES.find(x=>x.id===route);
  if(route==="home") renderDashboard();
  else if(m) renderModule(m);
  else if(route==="interview") renderInterview();
  else if(route==="flashcards") renderFlashcards();
  else if(route==="glossary") renderGlossary();
  else if(route==="acronyms") renderAcronyms();
  else if(route==="rice") renderRice();
  else { renderDashboard(); route="home"; }
  setActiveNav(route);
  if(location.hash.slice(1)!==route) history.replaceState(null,"","#"+route);
  content.scrollTo?.(0,0); window.scrollTo(0,0);
  closeSidebar();
}
window.addEventListener("hashchange",()=>navigate(location.hash.slice(1)));

/* ---------- module view ---------- */
function renderModule(m){
  const idx=MODULES.indexOf(m);
  const prev=MODULES[idx-1], next=MODULES[idx+1];
  content.innerHTML = `
  <div class="view active">
    <div class="sheet">
      <div class="eyebrow">Module ${String(m.num).padStart(2,"0")} · ${esc(m.tagline)}</div>
      <h2>${m.icon} ${esc(m.title)}</h2>
      ${m.html}
      <div class="mark-done">
        <span class="mc-ic" style="font-size:22px">${state.done[m.id]?"✅":"📘"}</span>
        <span class="txt">${state.done[m.id]?"You've completed this module.":"Finished reading? Take the quiz below or mark it complete."}</span>
        <button class="btn ${state.done[m.id]?"":"primary"}" id="mdBtn" style="margin-left:auto">${state.done[m.id]?"Mark not complete":"Mark complete"}</button>
      </div>
    </div>
    ${renderQuiz(m)}
    <div class="next-prev">
      ${prev?`<button class="btn" data-go="${prev.id}">← ${esc(prev.title)}</button>`:`<button class="btn" data-go="home">← Dashboard</button>`}
      ${next?`<button class="btn primary" data-go="${next.id}">${esc(next.title)} →</button>`:`<button class="btn primary" data-go="interview">Interview Prep →</button>`}
    </div>
  </div>`;
  const mdBtn=$("#mdBtn");
  mdBtn.onclick=()=>{ if(state.done[m.id]){ delete state.done[m.id]; save(); buildNav(); updateProgress(); renderModule(m); } else { markDone(m.id); renderModule(m); } };
  wireQuiz(m);
}

/* ---------- quiz ---------- */
function renderQuiz(m){
  let qs="";
  m.quiz.forEach((q,i)=>{
    let opts="";
    q.opts.forEach((o,j)=>{ opts += `<button class="quiz-opt" data-q="${i}" data-o="${j}">${esc(o)}<span class="mk"></span></button>`; });
    qs += `<div class="quiz-q" data-qi="${i}">
      <div class="qtext"><span class="chip">${i+1}</span><span>${esc(q.q)}</span></div>
      ${opts}
      <div class="quiz-explain" id="ex-${m.id}-${i}"></div>
    </div>`;
  });
  return `<div class="quiz-box" id="quiz-${m.id}">
    <div class="eyebrow" style="color:var(--signal)">Knowledge check</div>
    <h3>Quiz — ${esc(m.title)}</h3>
    <p style="color:rgba(241,236,224,.75);font-size:.95rem">Pick an answer to see instant feedback. Answer all ${m.quiz.length} to complete the module.</p>
    ${qs}
    <div class="quiz-result" id="res-${m.id}"></div>
  </div>`;
}
function wireQuiz(m){
  const answered={};
  const box=$("#quiz-"+m.id);
  box.querySelectorAll(".quiz-opt").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.q, j=+btn.dataset.o;
      if(answered[i]!==undefined) return;
      answered[i]=j;
      const q=m.quiz[i];
      const group=box.querySelectorAll(`.quiz-opt[data-q="${i}"]`);
      group.forEach(b=>{
        b.classList.add("disabled");
        const oj=+b.dataset.o;
        if(oj===q.a){ b.classList.add("correct"); b.querySelector(".mk").textContent="✓"; }
        if(oj===j && j!==q.a){ b.classList.add("wrong"); b.querySelector(".mk").textContent="✗"; }
      });
      const ex=$("#ex-"+m.id+"-"+i);
      ex.innerHTML=(j===q.a?"<b>Correct.</b> ":"<b>Not quite.</b> ")+esc(q.ex);
      ex.classList.add("show");
      if(Object.keys(answered).length===m.quiz.length) finishQuiz(m,answered);
    };
  });
}
function finishQuiz(m,answered){
  let correct=0; m.quiz.forEach((q,i)=>{ if(answered[i]===q.a) correct++; });
  const score=Math.round(correct/m.quiz.length*100);
  state.scores[m.id]=score; 
  const res=$("#res-"+m.id);
  const pass=score>=60;
  res.innerHTML=`<div class="score">${score}%</div>
    <p style="margin:.2em 0 0"><b>${correct}/${m.quiz.length} correct.</b> ${pass?"Nicely done — you've got this module.":"Review the explanations above and try again."}</p>`;
  res.classList.add("show");
  if(pass) markDone(m.id); else save();
}

    <h2>🎤 Crack the PM interview</h2>
    <p class="lead">PM interviews test <b>how you think</b>, not trivia. Learn the question types and a repeatable structure for each. Click a question to reveal a model approach and the traits interviewers score.</p>
    <div class="note key"><span class="lbl">The universal move</span>Whatever the question — <b>clarify first, structure your answer out loud, anchor on a user & a goal, state trade-offs, and end with a success metric.</b> Thinking process beats a clever answer.</div>
    <div class="note do"><span class="lbl">Behavioural? Use STAR</span><b>S</b>ituation · <b>T</b>ask · <b>A</b>ction (say “I”) · <b>R</b>esult (quantified) — then a one-line learning.</div>
    <div class="filter-tags" id="ivTags">${cats.map((c,i)=>`<span class="ftag ${i===0?"active":""}" data-cat="${esc(c)}">${esc(c)}</span>`).join("")}</div>
    <div id="ivList"></div>
  </div></div>`;
  const list=$("#ivList");
  function draw(cat){
    const items=INTERVIEW.filter(i=>cat==="All"||i.cat===cat);
    list.innerHTML=items.map((it,i)=>`<div class="iv-item" data-i="${i}">
      <div class="iv-q"><span class="chip">Q</span><span>${esc(it.q)}</span><span class="pill sig cat">${esc(it.cat)}</span></div>
      <div class="iv-a">${it.approach}<div class="note do" style="margin-top:14px"><span class="lbl">Interviewers are scoring</span>${it.points.map(p=>esc(p)).join(" &nbsp;·&nbsp; ")}</div></div>
    </div>`).join("");
    list.querySelectorAll(".iv-item").forEach(el=>{ el.querySelector(".iv-q").onclick=()=>el.classList.toggle("open"); });
  }
  draw("All");
  $("#ivTags").querySelectorAll(".ftag").forEach(t=>{ t.onclick=()=>{ $("#ivTags").querySelectorAll(".ftag").forEach(x=>x.classList.remove("active")); t.classList.add("active"); draw(t.dataset.cat); }; });
}

/* ---------- flashcards ---------- */
let fcDeck=[], fcIdx=0, fcFilter="all";
function buildDeck(){
  const terms=GLOSSARY.map(g=>({kind:"Term",cat:g.c,front:g.t,back:g.d,deck:"terms"}));
  const acr=ACRONYMS.map(a=>({kind:"Acronym",cat:"Acronym",front:a.a,back:"<b>"+esc(a.f)+"</b><br>"+esc(a.d),deck:"acronyms"}));
  let d=[...terms,...acr];
  if(fcFilter==="terms") d=terms; else if(fcFilter==="acronyms") d=acr;
  return d;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderFlashcards(){
  content.innerHTML=`<div class="view active"><div class="sheet">
    <div class="eyebrow">Flashcards</div>
    <h2>🃏 Speak fluent product</h2>
    <p class="lead">Flip through key terms and acronyms until the language is second nature. Click the card to flip · use the arrows or your keyboard (← → to move, space to flip).</p>
    <div class="filter-tags" id="fcTabs">
      <span class="ftag ${fcFilter==="all"?"active":""}" data-f="all">All</span>
      <span class="ftag ${fcFilter==="terms"?"active":""}" data-f="terms">Terms</span>
      <span class="ftag ${fcFilter==="acronyms"?"active":""}" data-f="acronyms">Acronyms</span>
    </div>
    <div class="fc-stage"><div class="fc" id="fc">
      <div class="fc-face fc-front"><div class="kind" id="fcKind"></div><div class="term" id="fcFront"></div><div class="hint">click to flip</div></div>
      <div class="fc-face fc-back"><div class="kind">Definition</div><div class="def" id="fcBack"></div><div class="hint">click to flip back</div></div>
    </div></div>
    <div class="fc-controls">
      <button class="btn" id="fcPrev">← Prev</button>
      <span class="fc-count" id="fcCount"></span>
      <button class="btn" id="fcNext">Next →</button>
      <button class="btn" id="fcShuffle">🔀 Shuffle</button>
    </div>
  </div></div>`;
  fcDeck=buildDeck(); fcIdx=0; drawCard();
  $("#fcTabs").querySelectorAll(".ftag").forEach(t=>{ t.onclick=()=>{ fcFilter=t.dataset.f; renderFlashcards(); }; });
  $("#fc").onclick=()=>$("#fc").classList.toggle("flip");
  $("#fcPrev").onclick=()=>move(-1); $("#fcNext").onclick=()=>move(1);
  $("#fcShuffle").onclick=()=>{ fcDeck=shuffle(fcDeck.slice()); fcIdx=0; drawCard(); toast("Shuffled "+fcDeck.length+" cards"); };
}
function drawCard(){
  const c=fcDeck[fcIdx]; if(!c) return;
  $("#fc").classList.remove("flip");
  $("#fcKind").textContent=c.kind+(c.cat&&c.kind==="Term"?" · "+c.cat:"");
  $("#fcFront").innerHTML=esc(c.front);
  $("#fcBack").innerHTML=c.back;
  $("#fcCount").textContent=(fcIdx+1)+" / "+fcDeck.length;
}
function move(d){ fcIdx=(fcIdx+d+fcDeck.length)%fcDeck.length; drawCard(); }
document.addEventListener("keydown",e=>{
  if(!$("#fc")) return;
  if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
});

/* ---------- glossary ---------- */
function renderGlossary(){
  const cats=["All",...Array.from(new Set(GLOSSARY.map(g=>g.c))).sort()];
  content.innerHTML=`<div class="view active"><div class="sheet">
    <div class="eyebrow">Glossary</div>
    <h2>📖 The product manager's dictionary</h2>
    <p class="lead">${GLOSSARY.length} terms in plain English. Search or filter by area.</p>
    <div class="searchbar"><input type="text" id="glSearch" placeholder="Search terms and definitions…"></div>
    <div class="filter-tags" id="glTags">${cats.map((c,i)=>`<span class="ftag ${i===0?"active":""}" data-cat="${esc(c)}">${esc(c)}</span>`).join("")}</div>
    <dl id="glList"></dl>
  </div></div>`;
  let cat="All";
  function draw(){
    const q=($("#glSearch").value||"").toLowerCase();
    const items=GLOSSARY.filter(g=>(cat==="All"||g.c===cat)&&(!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q)))
      .sort((a,b)=>a.t.localeCompare(b.t));
    $("#glList").innerHTML=items.length?items.map(g=>`<div class="term-row"><dt>${esc(g.t)}<span class="cat">${esc(g.c)}</span></dt><dd>${esc(g.d)}</dd></div>`).join(""):`<div class="empty">No matches. Try another word.</div>`;
  }
  $("#glSearch").oninput=draw;
  $("#glTags").querySelectorAll(".ftag").forEach(t=>{ t.onclick=()=>{ $("#glTags").querySelectorAll(".ftag").forEach(x=>x.classList.remove("active")); t.classList.add("active"); cat=t.dataset.cat; draw(); }; });
  draw();
}

/* ---------- acronyms ---------- */
function renderAcronyms(){
  content.innerHTML=`<div class="view active"><div class="sheet">
    <div class="eyebrow">Acronym Sheet</div>
    <h2>🔤 Decode the alphabet soup</h2>
    <p class="lead">${ACRONYMS.length} acronyms every PM hears. Search to find one fast.</p>
    <div class="searchbar"><input type="text" id="acSearch" placeholder="Search e.g. RICE, CAC, GTM…"></div>
    <dl id="acList"></dl>
  </div></div>`;
  function draw(){
    const q=($("#acSearch").value||"").toLowerCase();
    const items=ACRONYMS.filter(a=>!q||a.a.toLowerCase().includes(q)||a.f.toLowerCase().includes(q)||a.d.toLowerCase().includes(q))
      .sort((a,b)=>a.a.localeCompare(b.a));
    $("#acList").innerHTML=items.length?items.map(a=>`<div class="term-row"><dt>${esc(a.a)}<span class="cat">${esc(a.f)}</span></dt><dd>${esc(a.d)}</dd></div>`).join(""):`<div class="empty">No matches.</div>`;
  }
  $("#acSearch").oninput=draw; draw();
}

/* ---------- RICE calculator ---------- */
function renderRice(){
  content.innerHTML=`<div class="view active"><div class="sheet">
    <div class="eyebrow">Interactive Tool</div>
    <h2>🧮 RICE prioritisation calculator</h2>
    <p class="lead">Score a feature to compare it objectively against others. <b>RICE = (Reach × Impact × Confidence) ÷ Effort.</b> Higher scores are higher priority.</p>
    <div class="calc">
      <div class="calc-row">
        <div><label>Reach — people/events per time period</label><input type="number" id="rReach" value="1000" min="0"></div>
        <div><label>Impact — per person</label>
          <select id="rImpact">
            <option value="3">Massive (3×)</option>
            <option value="2">High (2×)</option>
            <option value="1" selected>Medium (1×)</option>
            <option value="0.5">Low (0.5×)</option>
            <option value="0.25">Minimal (0.25×)</option>
          </select></div>
      </div>
      <div class="calc-row">
        <div><label>Confidence in your estimates</label>
          <select id="rConf">
            <option value="1">High — 100%</option>
            <option value="0.8" selected>Medium — 80%</option>
            <option value="0.5">Low — 50%</option>
          </select></div>
        <div><label>Effort — person-months</label><input type="number" id="rEffort" value="2" min="0.1" step="0.5"></div>
      </div>
      <div class="calc-out"><div class="l mono" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,236,224,.7)">RICE score</div><div class="rscore" id="rScore">—</div><div id="rHint" style="font-size:.9rem;color:rgba(241,236,224,.8)"></div></div>
    </div>
    <div class="note"><span class="lbl">Read it right</span>The number is only meaningful <b>relative to other features scored the same way</b>. Score your whole list, then sort. Treat it as structured debate, not gospel — garbage estimates give confident-looking garbage.</div>
    <div class="note do"><span class="lbl">Tip</span>Keep <b>Reach</b> on a consistent time window (e.g. per quarter) across all features so scores are comparable.</div>
  </div></div>`;
  function calc(){
    const reach=+$("#rReach").value||0, impact=+$("#rImpact").value, conf=+$("#rConf").value, effort=+$("#rEffort").value||0;
    if(effort<=0){ $("#rScore").textContent="—"; $("#rHint").textContent="Enter an effort greater than 0."; return; }
    const score=(reach*impact*conf)/effort;
    $("#rScore").textContent=score.toLocaleString(undefined,{maximumFractionDigits:0});
    $("#rHint").textContent=`(${reach.toLocaleString()} × ${impact} × ${conf}) ÷ ${effort} person-months`;
  }
  ["rReach","rImpact","rConf","rEffort"].forEach(id=>{ $("#"+id).oninput=calc; $("#"+id).onchange=calc; });
  calc();
}

/* ---------- global click delegation for data-go ---------- */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ navigate(g.dataset.go); return; }
  const n=e.target.closest(".nav-item"); if(n){ navigate(n.dataset.route); return; }
  const card=e.target.closest("[data-go]"); if(card){ navigate(card.dataset.go); }
});

/* ---------- sidebar (mobile) ---------- */
function closeSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }
$("#hamburger").onclick=()=>{ sidebar.classList.toggle("open"); scrim.classList.toggle("show"); };
scrim.onclick=closeSidebar;

/* ---------- reset ---------- */
$("#resetBtn").onclick=()=>{ if(confirm("Reset all progress and quiz scores? This can't be undone.")){ state={done:{},scores:{}}; save(); buildNav(); updateProgress(); navigate("home"); toast("Progress reset"); } };

/* ---------- boot ---------- */
buildNav();
updateProgress();
navigate(location.hash.slice(1)||"home");
</script>
