<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG Learning Hub</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #8b949e;
    margin-bottom: 32px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    margin-bottom: 12px;
  }
  a {
    display: block;
    padding: 16px 20px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #58a6ff;
    text-decoration: none;
    font-size: 1.05rem;
    transition: background 0.15s, border-color 0.15s;
  }
  a:hover {
    background: #1c2330;
    border-color: #58a6ff;
  }
  #gate {
    max-width: 360px;
    margin: 120px auto 0;
    text-align: center;
  }
  #gate input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 1rem;
    margin-top: 16px;
  }
  #gate button {
    width: 100%;
    padding: 12px 14px;
    margin-top: 10px;
    background: #238636;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  #gate .error {
    color: #f85149;
    margin-top: 10px;
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  #content {
    display: none;
  }
</style>
</head>
<body>
  <div id="gate">
    <h1>PG Learning Hub</h1>
    <p class="subtitle">Enter password to view</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button id="unlock-btn">Unlock</button>
    <div class="error" id="gate-error"></div>
  </div>

  <div class="container" id="content">
    <h1>PG Learning Hub</h1>
    <p class="subtitle">Pages available in this repository:</p>
    <ul id="file-list">
      <li class="status">Loading...</li>
    </ul>
  </div>

  <script>
    // SHA-256 hash of the password. Replace this with your own hash (see instructions below).
    const PASSWORD_HASH = "ff47413ea084aa2cad368f0b21e9229de6165c5828a7ca377dc2336a2c9a78e8";

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function tryUnlock() {
      const input = document.getElementById("password-input").value;
      const hash = await sha256(input);
      if (hash === PASSWORD_HASH) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("content").style.display = "block";
        sessionStorage.setItem("unlocked", "true");
        loadFiles();
      } else {
        document.getElementById("gate-error").textContent = "Incorrect password.";
      }
    }

    document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
    document.getElementById("password-input").addEventListener("keydown", e => {
      if (e.key === "Enter") tryUnlock();
    });

    if (sessionStorage.getItem("unlocked") === "true") {
      document.getElementById("gate").style.display = "none";
      document.getElementById("content").style.display = "block";
      loadFiles();
    }

    const owner = "prstgpta";
    const repo = "PG_Learning-hub";

    function loadFiles() {
    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)
      .then(res => res.json())
      .then(items => {
        const list = document.getElementById("file-list");
        list.innerHTML = "";

        const htmlFiles = items
          .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".html") && item.name.toLowerCase() !== "index.html")
          .sort((a, b) => a.name.localeCompare(b.name));

        if (htmlFiles.length === 0) {
          list.innerHTML = '<li class="status">No pages found yet.</li>';
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = encodeURI(file.name);
          a.textContent = file.name.replace(/\.html$/i, "").replace(/[-_]/g, " ");
          li.appendChild(a);
          list.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById("file-list").innerHTML =
          '<li class="status">Could not load file list. Refresh or check back later.</li>';
      });
    }
  </script>
</body>
</html>
