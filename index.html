<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG Learning Hub</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #8b949e;
    margin-bottom: 32px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    margin-bottom: 12px;
  }
  a {
    display: block;
    padding: 16px 20px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #58a6ff;
    text-decoration: none;
    font-size: 1.05rem;
    transition: background 0.15s, border-color 0.15s;
  }
  a:hover {
    background: #1c2330;
    border-color: #58a6ff;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>PG Learning Hub</h1>
    <p class="subtitle">Pages available in this repository:</p>
    <ul id="file-list">
      <li class="status">Loading...</li>
    </ul>
  </div>

  <script>
    const owner = "prstgpta";
    const repo = "PG_Learning-hub";

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`)
      .then(res => res.json())
      .then(items => {
        const list = document.getElementById("file-list");
        list.innerHTML = "";

        const htmlFiles = items
          .filter(item => item.type === "file" && item.name.toLowerCase().endsWith(".html") && item.name.toLowerCase() !== "index.html")
          .sort((a, b) => a.name.localeCompare(b.name));

        if (htmlFiles.length === 0) {
          list.innerHTML = '<li class="status">No pages found yet.</li>';
          return;
        }

        htmlFiles.forEach(file => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = encodeURI(file.name);
          a.textContent = file.name.replace(/\.html$/i, "").replace(/[-_]/g, " ");
          li.appendChild(a);
          list.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById("file-list").innerHTML =
          '<li class="status">Could not load file list. Refresh or check back later.</li>';
      });
  </script>
</body>
</html>
